                `<g transform="translate(230,8) scale(0.33)"><circle cx="28" cy="30" r="22" fill="#E17055" stroke="#555" stroke-width="2.5"/><circle cx="22" cy="24" r="4" fill="#555"/></g>`,
                `<g transform="translate(290,10) scale(0.36)"><circle cx="25" cy="25" r="10" fill="#FFEAA7"/><circle cx="15" cy="15" r="9" fill="#FDCB6E"/><circle cx="35" cy="35" r="9" fill="#FDCB6E"/></g>`,
                `<g transform="translate(10,10) scale(0.33)"><ellipse cx="25" cy="30" rx="18" ry="20" fill="#fff" stroke="#555" stroke-width="2.5"/><circle cx="18" cy="22" r="3" fill="#555"/></g>`,
                `<g transform="translate(60,8) scale(0.32)"><path d="M0 40 Q30 -15 60 40" fill="none" stroke="#FF6B6B" stroke-width="4"/></g>`,
                `<g transform="translate(140,8) scale(0.35)"><circle cx="20" cy="22" r="12" fill="#dfe6e9"/><circle cx="35" cy="18" r="9" fill="#dfe6e9"/></g>`
            ];
            const count = 4 + Math.floor(Math.random() * 3);
            const shuffled = [...doodles].sort(() => Math.random() - 0.5);
            return `<svg viewBox="0 0 360 50" xmlns="http://www.w3.org/2000/svg">${shuffled.slice(0, count).join('')}</svg>`;
        }

        // ========== 词形变化生成 ==========
        // 常见不规则动词表（base → 其他形式）
        const IRREGULAR_VERBS = {
            'be': ['is', 'am', 'are', 'was', 'were', 'been', 'being'],
            'have': ['has', 'had', 'having'],
            'do': ['does', 'did', 'done', 'doing'],
            'go': ['goes', 'went', 'gone', 'going'],
            'make': ['makes', 'made', 'making'],
            'take': ['takes', 'took', 'taken', 'taking'],
            'keep': ['keeps', 'kept', 'keeping'],
            'fall': ['falls', 'fell', 'fallen', 'falling'],
            'run': ['runs', 'ran', 'running'],
            'bring': ['brings', 'brought', 'bringing'],
            'come': ['comes', 'came', 'coming'],
            'set': ['sets', 'setting'],
            'put': ['puts', 'putting'],
            'shed': ['sheds', 'shedding'],
            'wear': ['wears', 'wore', 'worn', 'wearing'],
            'stand': ['stands', 'stood', 'standing'],
            'lose': ['loses', 'lost', 'losing'],
            'dwell': ['dwells', 'dwelt', 'dwelled', 'dwelling'],
            'veer': ['veers', 'veering', 'veered'],
            'spark': ['sparks', 'sparking', 'sparked'],
            'wreak': ['wreaks', 'wreaking', 'wreaked'],
            'zero': ['zeroes', 'zeros', 'zeroing', 'zeroed'],
            'seek': ['seeks', 'sought', 'seeking'],
            'give': ['gives', 'gave', 'given', 'giving'],
            'get': ['gets', 'got', 'gotten', 'getting'],
            'see': ['sees', 'saw', 'seen', 'seeing'],
            'know': ['knows', 'knew', 'known', 'knowing'],
            'think': ['thinks', 'thought', 'thinking'],
            'find': ['finds', 'found', 'finding'],
            'tell': ['tells', 'told', 'telling'],
            'say': ['says', 'said', 'saying'],
            'become': ['becomes', 'became', 'becoming'],
            'leave': ['leaves', 'left', 'leaving'],
            'feel': ['feels', 'felt', 'feeling'],
            'mean': ['means', 'meant', 'meaning'],
            'pay': ['pays', 'paid', 'paying'],
            'speak': ['speaks', 'spoke', 'spoken', 'speaking'],
            'write': ['writes', 'wrote', 'written', 'writing'],
            'spend': ['spends', 'spent', 'spending'],
            'begin': ['begins', 'began', 'begun', 'beginning'],
            'lead': ['leads', 'led', 'leading'],
            'build': ['builds', 'built', 'building'],
            'draw': ['draws', 'drew', 'drawn', 'drawing'],
            'grow': ['grows', 'grew', 'grown', 'growing'],
            'rise': ['rises', 'rose', 'risen', 'rising'],
            'drive': ['drives', 'drove', 'driven', 'driving'],
            'hold': ['holds', 'held', 'holding'],
            'win': ['wins', 'won', 'winning'],
            'sell': ['sells', 'sold', 'selling'],
            'buy': ['buys', 'bought', 'buying'],
            'cut': ['cuts', 'cutting'],
            'let': ['lets', 'letting'],
            'hit': ['hits', 'hitting'],
            'cost': ['costs', 'costing'],
            'hurt': ['hurts', 'hurting'],
            'shut': ['shuts', 'shutting'],
            'spread': ['spreads', 'spreading'],
        };

        // 反向索引：屈折形式 → 原形（用于查词翻译）
        const IRREGULAR_REVERSE = {};
        for (const [base, forms] of Object.entries(IRREGULAR_VERBS)) {
            for (const f of forms) {
                IRREGULAR_REVERSE[f] = base;
                IRREGULAR_REVERSE[f.toLowerCase()] = base;
            }
        }

        function inflectWord(word) {
            const forms = new Set();
            forms.add(word);
            const w = word.toLowerCase();

            // 先查不规则动词表
            if (IRREGULAR_VERBS[w]) {
                for (const irr of IRREGULAR_VERBS[w]) {
                    forms.add(irr);
                    // 首字母大写形式
                    forms.add(irr.charAt(0).toUpperCase() + irr.slice(1));
                }
            }

            // 规则变化: +s (复数/第三人称单数)
            forms.add(word + 's');

            // +es (以 s/x/z/ch/sh/o 结尾)
            if (w.endsWith('s') || w.endsWith('x') || w.endsWith('z') ||
                w.endsWith('ch') || w.endsWith('sh') || w.endsWith('o')) {
                forms.add(word + 'es');
            }

            // 辅音+y → ies
            if (w.length > 2 && w.endsWith('y') && !'aeiou'.includes(w[w.length - 2])) {
                forms.add(word.slice(0, -1) + 'ies');
            }

            // 过去式/过去分词: +ed, +d
            forms.add(word + 'ed');
            forms.add(word + 'd');

            // 重读闭音节双写辅音 +ed/+ing
            if (w.length >= 2) {
                const last = w[w.length - 1];
                const secondLast = w[w.length - 2];
                const thirdLast = w.length >= 3 ? w[w.length - 3] : '';
                if ('bcdfghjklmnpqrstvwxyz'.includes(last) &&
                    'aeiou'.includes(secondLast) &&
                    !'aeiou'.includes(thirdLast || 'a')) {
                    forms.add(word + last + 'ed');
                    forms.add(word + last + 'ing');
                    forms.add(word + last + 'er');
                    forms.add(word + last + 'est');
                }
            }

            // 现在分词: +ing
            forms.add(word + 'ing');
            // 去掉 e + ing
            if (w.endsWith('e') && w.length > 2 && !w.endsWith('ee')) {
                forms.add(word.slice(0, -1) + 'ing');
            }

            // 比较级/最高级: +er, +est
            forms.add(word + 'er');
            forms.add(word + 'est');
            if (w.endsWith('e') && w.length > 2) {
                forms.add(word + 'r');
                forms.add(word + 'st');
            }

            // 副词: +ly
            forms.add(word + 'ly');
            if (w.endsWith('ic')) {
                forms.add(word + 'ally');
            }
            if (w.endsWith('le') && w.length > 2) {
                forms.add(word.slice(0, -2) + 'ly');
            }
            // 辅音+y → ily
            if (w.length > 2 && w.endsWith('y') && !'aeiou'.includes(w[w.length - 2])) {
                forms.add(word.slice(0, -1) + 'ily');
            }

            // 名词后缀
            forms.add(word + 'ness');
            if (w.endsWith('y') && w.length > 2 && !'aeiou'.includes(w[w.length - 2])) {
                forms.add(word.slice(0, -1) + 'iness');
            }
            forms.add(word + 'ment');
            forms.add(word + 'tion');
            forms.add(word + 'sion');
            if (w.endsWith('e') && w.length > 2) {
                forms.add(word.slice(0, -1) + 'ation');
                forms.add(word.slice(0, -1) + 'ition');
            }

            // 形容词后缀
            forms.add(word + 'able');
            forms.add(word + 'ible');
            forms.add(word + 'ful');
            forms.add(word + 'less');
            forms.add(word + 'ous');
            forms.add(word + 'ive');
            forms.add(word + 'al');

            return [...forms];
        }

        function inflectTerm(term) {
            const forms = new Set();
            forms.add(term); // 原形

            const words = term.split(' ');
            if (words.length === 1) {
                // 单个单词：生成所有屈折形式
                for (const form of inflectWord(term)) {
                    forms.add(form);
                }
            } else {
                // 短语：变化第一个单词（通常是动词）
                const firstWord = words[0];
                const rest = words.slice(1).join(' ');
                for (const inflected of inflectWord(firstWord)) {
                    forms.add(inflected + ' ' + rest);
                }
                // 也尝试变化第二个单词（某些短语动词可能第二个词是主要动词）
                // 例如 "go hand in hand" 中 go 是动词
                // 对于 "keep at bay" 等，第一词就是动词，无需额外处理
            }

            return [...forms];
        }

        // ========== 短语近邻匹配（允许短语单词之间夹着其他词） ==========
        function findPhraseProximitySpans(text, term, maxGap = 4) {
            // 将文本按单词拆分，记录每个单词的位置
            const tokens = [];
            const tokenRegex = /\S+/g;
            let m;
            while ((m = tokenRegex.exec(text)) !== null) {
                tokens.push({ word: m[0], start: m.index, end: m.index + m[0].length });
            }

            const phraseWords = term.split(' ');
            if (phraseWords.length < 2) return null;

            // 为短语中每个单词生成所有屈折形式
            const phraseVariants = phraseWords.map(w => {
                const forms = inflectWord(w).map(v => v.toLowerCase().replace(/[^a-z']/g, ''));
                return [...new Set(forms)];
            });

            // 遍历每个 token，尝试匹配短语的第一个词
            for (let i = 0; i < tokens.length; i++) {
                const tokenClean = tokens[i].word.toLowerCase().replace(/[^a-z']/g, '');
                if (!phraseVariants[0].includes(tokenClean)) continue;

                const spans = [{ start: tokens[i].start, end: tokens[i].end }];
                let phraseWordIdx = 1;
                let gapCount = 0;

                for (let j = i + 1; j < tokens.length && phraseWordIdx < phraseWords.length; j++) {
                    const tClean = tokens[j].word.toLowerCase().replace(/[^a-z']/g, '');
                    if (phraseVariants[phraseWordIdx].includes(tClean)) {
                        spans.push({ start: tokens[j].start, end: tokens[j].end });
                        phraseWordIdx++;
                        gapCount = 0;
                    } else {
                        gapCount++;
                        if (gapCount > maxGap) break;
                    }
                }

                if (phraseWordIdx === phraseWords.length) {
                    return spans;
                }
            }

            return null;
        }

        // ========== 文本高亮与可点击词 ==========
        function renderTextWithHighlights(text, highlightTerms, clickable = true) {
            const textLower = text.toLowerCase();
            const highlights = [];
            const seenSpans = new Set(); // 去重：同一位置只保留最长匹配
            for (const term of highlightTerms) {
                const variants = inflectTerm(term);
                let foundExact = false;

                // Phase 1: 精确变体匹配（含词形变化）
                for (const variant of variants) {
                    const variantLower = variant.toLowerCase();
                    let idx = 0;
                    while ((idx = textLower.indexOf(variantLower, idx)) !== -1) {
                        const key = idx + ':' + (idx + variant.length);
                        if (!seenSpans.has(key)) {
                            highlights.push({ start: idx, end: idx + variant.length, term: term });
                            seenSpans.add(key);
                        }
                        idx += variant.length;
                        foundExact = true;
                    }
                }

                // Phase 2: 多词短语——若精确匹配未找到，尝试近邻匹配（允许夹词）
                if (!foundExact && term.includes(' ')) {
                    const proximitySpans = findPhraseProximitySpans(text, term);
                    if (proximitySpans) {
                        for (const span of proximitySpans) {
                            const key = span.start + ':' + span.end;
                            if (!seenSpans.has(key)) {
                                highlights.push({ start: span.start, end: span.end, term: term });
                                seenSpans.add(key);
                            }
                        }
                    }
                }
            }
            highlights.sort((a, b) => a.start - b.start || b.end - a.end);
            const merged = [];
            for (const h of highlights) {
                if (merged.length === 0 || h.start >= merged[merged.length - 1].end) merged.push(h);
            }
            let result = '';
            let pos = 0;
            for (const h of merged) {
                if (pos < h.start) result += wrapPlainWords(text.slice(pos, h.start));
                const onclick = clickable ? ` onclick="event.stopPropagation();onHighlightClick('${escapeJsString(escapeHtml(h.term))}')"` : '';
                result += `<span class="word-highlight" data-term="${escapeHtml(h.term)}"${onclick}>${escapeHtml(text.slice(h.start, h.end))}</span>`;
                pos = h.end;
            }
            if (pos < text.length) result += wrapPlainWords(text.slice(pos));
            return result;
        }

        function wrapPlainWords(text) {
            return text.replace(/([a-zA-Z]+(?:'[a-zA-Z]+)?)/g, (match) => {
                const safeHtml = escapeHtml(match);
                const safeJs = escapeJsString(safeHtml);
                return `<span class="word-clickable" data-word="${safeHtml}" onclick="event.stopPropagation();onWordClick(event, '${safeJs}')">${safeHtml}</span>`;
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 转义单引号，用于嵌入 JavaScript 单引号字符串（如 onclick="...'...'"）
        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // ========== 词译弹窗 ==========
        function lookupWord(w) {
            // 1. 精确匹配
            if (dictionary[w]) return dictionary[w];
            // 2. 去掉结尾标点后精确匹配
            const clean = w.replace(/[^a-z']/g, '');
            if (!clean || clean.length < 2) return null;
            if (dictionary[clean]) return dictionary[clean];
            // 3. 反向不规则动词/屈折形式查找
            const base = IRREGULAR_REVERSE[clean];
            if (base && dictionary[base]) return dictionary[base];
            // 4. 词干还原（后缀剥离 + 双写辅音还原）
            const tries = [];
            // 辅助：剥离后缀并生成候选（含双写辅音还原）
            function addStems(word, suffixLen, restoreE) {
                const stem = word.slice(0, -suffixLen);
                tries.push(stem);
                if (restoreE) tries.push(stem + 'e');
                // 双写辅音还原：running→runn→run, stopped→stopp→stop
                if (stem.length >= 3) {
                    const last = stem[stem.length - 1];
                    const secondLast = stem[stem.length - 2];
                    if (last === secondLast && 'bcdfghjklmnpqrstvwxyz'.includes(last)) {
                        const dedoubled = stem.slice(0, -1);
                        tries.push(dedoubled);
                        if (restoreE) tries.push(dedoubled + 'e');
                    }
                }
            }
            if (clean.endsWith("'s")) tries.push(clean.slice(0, -2));  // possessive: grandfathers → grandfather
            if (clean.endsWith('s') && !clean.endsWith('ss')) tries.push(clean.slice(0, -1));
            if (clean.endsWith('es')) tries.push(clean.slice(0, -2));
            if (clean.endsWith('ies')) tries.push(clean.slice(0, -3) + 'y');
            if (clean.endsWith('ied')) tries.push(clean.slice(0, -3) + 'y');  // carried→carry
            if (clean.endsWith('ves')) tries.push(clean.slice(0, -3) + 'f');
            if (clean.endsWith('ing')) addStems(clean, 3, true);
            if (clean.endsWith('ed')) { addStems(clean, 2, false); tries.push(clean.slice(0, -1)); addStems(clean, 2, true); }
            if (clean.endsWith('er')) { addStems(clean, 2, false); addStems(clean, 2, true); }
            if (clean.endsWith('est')) { addStems(clean, 3, false); addStems(clean, 3, true); }
            if (clean.endsWith('ly')) { tries.push(clean.slice(0, -2)); }
            if (clean.endsWith('ily') && clean.length > 4) tries.push(clean.slice(0, -3) + 'y');  // easily→easy
            if (clean.endsWith('iness')) tries.push(clean.slice(0, -5) + 'y');  // happiness→happy
            if (clean.endsWith('ness')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ment')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('tion')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('sion')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('able')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ible')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ful')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('less')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ous')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('ive')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('al')) tries.push(clean.slice(0, -2));
            if (clean.endsWith('ally')) tries.push(clean.slice(0, -4));
            for (const t of tries) { if (dictionary[t]) return dictionary[t]; }
            return null;
        }

        // ========== 翻译缓存 ==========
        const NEGATIVE_CACHE_TTL = 30 * 60 * 1000; // 失败的词 30 分钟内不再请求 API
        const FETCH_TIMEOUT_MS = 8000; // API 请求超时

        function getTranslationCache() {
            try { return JSON.parse(localStorage.getItem('word_cache') || '{}'); }
            catch (e) { return {}; }
        }
        function saveTranslationCache(cache) {
            try { localStorage.setItem('word_cache', JSON.stringify(cache)); }
            catch (e) { /* storage full, ignore */ }
        }

        async function translateWordENtoZH(word) {
            const clean = word.toLowerCase().replace(/[^a-z]/g, '');
            if (!clean) return null;

            // 1. 本地词典 + 词形还原（即使是单字母也要查）
            const local = lookupWord(clean);
            if (local) return local;
            // 单字母不再查API
            if (clean.length < 2) return null;

            // 2. 缓存命中（正向或负向）
            const cache = getTranslationCache();
            const cached = cache[clean];
            if (cached) {
                if (typeof cached === 'string' && cached.startsWith('__NEG_')) {
                    // 负缓存：带过期时间戳，过期后允许重试
                    const ts = parseInt(cached.slice(6), 10);
                    if (!isNaN(ts) && Date.now() - ts < NEGATIVE_CACHE_TTL) return null;
                    delete cache[clean]; // 过期，重试
                } else {
                    return cached; // 正向缓存命中
                }
            }

            // 3. MyMemory API（带超时）
            let translated = null;
            try {
                const controller = new AbortController();
                const timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
                const resp = await fetch(
                    'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(clean) + '&langpair=en|zh',
                    { signal: controller.signal }
                );
                clearTimeout(timer);
                const data = await resp.json();
                if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
                    translated = data.responseData.translatedText;
                }
            } catch (e) { /* MyMemory 失败，继续尝试下一级 */ }

            // 4. Google Translate 兜底（免费，无需 API Key）
            if (!translated) {
                try {
                    const controller2 = new AbortController();
                    const timer2 = setTimeout(function () { controller2.abort(); }, FETCH_TIMEOUT_MS);
                    const gresp = await fetch(
                        'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh&dt=t&q=' + encodeURIComponent(clean),
                        { signal: controller2.signal }
                    );
                    clearTimeout(timer2);
                    const gdata = await gresp.json();
                    // Google 返回格式：[[["翻译","word",...], ...], null, "en"]
                    if (gdata && gdata[0] && gdata[0][0] && gdata[0][0][0]) {
                        translated = gdata[0].map(function (item) { return item[0]; }).join(' | ');
                    }
                } catch (e2) { /* Google 也失败 */ }
            }

            // 5. 处理结果
            if (translated) {
                if (translated.toLowerCase() === clean.toLowerCase()) {
                    cache[clean] = '__NEG_' + Date.now();
                    saveTranslationCache(cache);
                    return null;
                }
                cache[clean] = translated;
                saveTranslationCache(cache);
                return translated;
            }

            // 6. 两级 API 均失败 → 负缓存
            cache[clean] = '__NEG_' + Date.now();
            saveTranslationCache(cache);
            return null;
        }

        function formatTranslation(translation) {
            if (!translation) return null;
            // 用 | 分隔多个释义
            const parts = translation.split('|');
            if (parts.length === 1) return parts[0];
            return parts.map(function (p, i) { return i === 0 ? '<strong>' + p + '</strong>' : p; }).join(' · ');
        }

        function onWordClick(event, word) {
            event.stopPropagation();

            // 听力播放中点击原文单词 → 跳转到该单词所在句子
            if (listenIsPlaying && event.target.closest('#listenTranscript')) {
                const sentenceEl = event.target.closest('.t-sentence');
                if (sentenceEl) {
                    const idx = parseInt(sentenceEl.getAttribute('data-sidx'));
                    if (!isNaN(idx)) {
                        seekToSentence(idx);
                        return;
                    }
                }
            }

            const wordLower = word.toLowerCase().replace(/[^a-z']/g, '');
            const tooltip = document.getElementById('wordTooltip');
            const tooltipOrig = document.getElementById('tooltipOriginal');
            const tooltipTrans = document.getElementById('tooltipTranslation');

            if (tooltipWord === wordLower && tooltip.classList.contains('visible')) {
                hideTooltip();
                return;
            }
            tooltipWord = wordLower;
            tooltipOrig.textContent = word;
            tooltipTrans.innerHTML = '查询中…';

            const target = event.target;
            const rect = target.getBoundingClientRect();
            // 动态计算宽度
            tooltip.style.whiteSpace = 'normal';
            tooltip.style.maxWidth = '280px';
            const tooltipWidth = Math.min(tooltip.offsetWidth || 180, 280);
            const left = Math.min(Math.max(rect.left + rect.width / 2 - tooltipWidth / 2, 10), window.innerWidth - tooltipWidth - 10);
            // 优先显示在单词上方，若空间不足则显示在下方
            const tooltipHeight = tooltip.offsetHeight || 50;
            let top = rect.top - tooltipHeight - 8;
            if (top < 8) top = rect.bottom + 8;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.classList.add('visible');

            translateWordENtoZH(wordLower).then(function (translation) {
                if (tooltipWord !== wordLower) return;
                if (translation) {
                    tooltipTrans.innerHTML = formatTranslation(translation);
                    return;
                }
                // 第一次失败，等 500ms 后重试一次
                tooltipTrans.innerHTML = '重试中…';
                setTimeout(function () {
                    if (tooltipWord !== wordLower) return;
                    translateWordENtoZH(wordLower).then(function (retry) {
                        if (tooltipWord !== wordLower) return;
                        if (retry) {
                            tooltipTrans.innerHTML = formatTranslation(retry);
                        } else {
                            tooltipTrans.innerHTML = '翻译不可用';
                        }
                    }).catch(function () {
                        if (tooltipWord === wordLower) tooltipTrans.innerHTML = '翻译不可用';
                    });
                }, 500);
            }).catch(function () {
                // Promise 异常 → 重试
                if (tooltipWord !== wordLower) return;
                tooltipTrans.innerHTML = '重试中…';
                setTimeout(function () {
                    if (tooltipWord !== wordLower) return;
                    translateWordENtoZH(wordLower).then(function (retry) {
                        if (tooltipWord !== wordLower) return;
                        tooltipTrans.innerHTML = retry ? formatTranslation(retry) : '翻译不可用';
                    }).catch(function () {
                        if (tooltipWord === wordLower) tooltipTrans.innerHTML = '翻译不可用';
                    });
                }, 500);
            });
        }

        function hideTooltip() {
            document.getElementById('wordTooltip').classList.remove('visible');
            tooltipWord = null;
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.word-clickable')) hideTooltip();
        });

        function onHighlightClick(term) {
            stopSpeaking();
            const idx = currentVocabulary.findIndex(v => v.en.toLowerCase() === term.toLowerCase());
            if (idx >= 0) {
                cameFromArticle = true;
                hideAllPages();
                document.getElementById('learnPage').style.display = 'flex';
                document.getElementById('learnPage').classList.add('active');
                document.getElementById('btnBackArticle').classList.add('visible');
                currentIndex = idx;
                cnRevealed = false;
                exRevealed = false;
                renderWord(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function onBankTagClick(term) { onHighlightClick(term); }

        function backToArticle() {
            stopSpeaking();
            cameFromArticle = false;
            hideAllPages();
            document.getElementById('challengePage').style.display = 'flex';
            document.getElementById('challengePage').classList.add('active');
            document.getElementById('btnBackArticle').classList.remove('visible');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== 渲染单词/短语 ==========
        function renderWord(index) {
            const item = currentVocabulary[index];
            document.getElementById('currentNum').textContent = index + 1;
            const counterLabel = document.getElementById('wordCounterLabel');
            counterLabel.innerHTML = item.type === 'phrase'
                ? '短语 <strong id="currentNum">' + (index + 1) + '</strong> / ' + currentVocabulary.length
                : '词汇 <strong id="currentNum">' + (index + 1) + '</strong> / ' + currentVocabulary.length;

            const typeTag = document.getElementById('typeTag');
            if (item.type === 'phrase') {
                typeTag.textContent = '📎 PHRASE'; typeTag.className = 'type-tag phrase';
            } else {
                typeTag.textContent = item.pos.toUpperCase(); typeTag.className = 'type-tag word';
            }

            const wordEl = document.getElementById('wordEnglish');
            // 短语中每个单词可点击翻译
            wordEl.innerHTML = wrapPlainWords(item.en);
            wordEl.className = item.type === 'phrase' ? 'word-english phrase-text' : 'word-english';
            document.getElementById('wordPhonetic').textContent = item.phonetic;
            document.getElementById('enDefinition').innerHTML = wrapPlainWords(item.enDef);
            document.getElementById('exampleEn').innerHTML = renderTextWithHighlights(item.exampleEn, vocabKeys(), false);

            const cnDef = document.getElementById('cnDefinition');
            cnDef.textContent = item.cn;
            const doodleCover = document.getElementById('doodleCover');
            const revealBtn = document.getElementById('revealBtn');
            cnRevealed = false;
            cnDef.classList.add('blurred');
            doodleCover.style.display = 'flex';
            doodleCover.classList.remove('fading');
            doodleCover.innerHTML = generateDoodleSVG();
            revealBtn.textContent = '👀 显示';
            revealBtn.classList.remove('showing');

            const exampleCn = document.getElementById('exampleCn');
            exampleCn.innerHTML = item.exampleCn;
            const doodleCoverEx = document.getElementById('doodleCoverExample');
            const revealBtnEx = document.getElementById('revealBtnExample');
            exRevealed = false;
            exampleCn.classList.add('blurred');
            doodleCoverEx.style.display = 'flex';
            doodleCoverEx.classList.remove('fading');
            doodleCoverEx.innerHTML = generateSmallDoodleSVG();
            revealBtnEx.textContent = '👀 显示翻译';
            revealBtnEx.classList.remove('showing');

            const pct = ((index + 1) / currentVocabulary.length) * 100;
            document.getElementById('miniProgressFill').style.width = pct + '%';
            buildNumberGrid(index);

            const btnPrev = document.getElementById('btnPrev');
            if (index === 0) btnPrev.classList.add('hidden-nav');
            else btnPrev.classList.remove('hidden-nav');

            const btnBack = document.getElementById('btnBackArticle');
            if (cameFromArticle) btnBack.classList.add('visible');
            else btnBack.classList.remove('visible');

            const btnNext = document.getElementById('btnNext');
            const nextLabel = document.getElementById('nextLabel');
            if (index >= currentVocabulary.length - 1 && !cameFromArticle) {
                btnNext.classList.add('finish');
                nextLabel.textContent = '🏆 最终挑战';
            } else {
                btnNext.classList.remove('finish');
                nextLabel.textContent = '下一个';
            }
        }

        // ========== 数字网格 ==========
        function buildNumberGrid(activeIndex) {
            const grid = document.getElementById('numberGrid');
            let html = '';
            for (let i = 0; i < currentVocabulary.length; i++) {
                const isActive = i === activeIndex;
                html += `<div class="grid-num${isActive ? ' active' : ''}" onclick="event.stopPropagation();jumpToWord(${i})">${i + 1}</div>`;
            }
            grid.innerHTML = html;
        }

        function toggleNumberGrid(event) {
            event.stopPropagation();
            document.getElementById('numberGrid').classList.toggle('open');
        }

        function jumpToWord(index) {
            stopSpeaking();
            document.getElementById('numberGrid').classList.remove('open');
            currentIndex = index;
            cnRevealed = false;
            exRevealed = false;
            renderWord(currentIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.mini-progress-wrapper')) {
                document.getElementById('numberGrid').classList.remove('open');
            }
        });

        // ========== 切换中文 ==========
        function toggleChinese() {
            const cnDef = document.getElementById('cnDefinition');

                revealBtn.classList.add('showing');

        // ========== 导航 ==========
        function nextWord() {
            stopSpeaking();
            if (currentIndex < currentVocabulary.length - 1) {
                currentIndex++;
                cnRevealed = false; exRevealed = false;
                renderWord(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (cameFromArticle) {
                currentIndex = 0;
                cnRevealed = false; exRevealed = false;
                renderWord(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                markHistoryCompleted();
                cameFromArticle = false;
                document.getElementById('btnBackArticle').classList.remove('visible');
                showCompletePage();
            }
        }

        function prevWord() {
            stopSpeaking();
            if (currentIndex > 0) {
                currentIndex--;
                cnRevealed = false; exRevealed = false;
                renderWord(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (cameFromArticle) {
                currentIndex = currentVocabulary.length - 1;
                cnRevealed = false; exRevealed = false;
                renderWord(currentIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });

        // ========== 最终挑战文章（动态生成） ==========
        function renderArticle() {
            const allTerms = currentVocabulary.map(v => v.en);
            document.getElementById('bankTags').innerHTML = allTerms.map(t =>
                `<span class="bank-tag" onclick="onBankTagClick('${escapeHtml(t)}')">${escapeHtml(t)}</span>`
            ).join('');

            const pool = [...currentVocabulary];
            const take = () => pool.length > 0 ? pool.splice(Math.floor(Math.random() * pool.length), 1)[0] : null;
            const use = (w) => {
                if (!w) return null;
                return `<span class="word-highlight" data-term="${escapeHtml(w.en)}" onclick="event.stopPropagation();onHighlightClick('${escapeJsString(escapeHtml(w.en))}')">${escapeHtml(w.en)}</span>`;
            };

            // 段落模板：英文 + 对应中文翻译（[W] 占位符会被对应的词汇/短语替换）
            // 一篇连贯的文章："祖父的笔记本"——每个[W]对应一个已学词汇/短语，总计30个
            const paraTemplates = [
                {
                    en: `Last summer, I found an old notebook in my grandfather's attic. Its yellow pages held words that would [W] everything I knew about our family. The notebook described a secret project he had worked on for over forty years — something that could [W] millions of lives. I knew I had to [W] his story and find out what happened. I decided to [W] every clue he had left behind.`,
                    cn: `去年夏天，我在祖父的阁楼里发现了一本旧笔记本。泛黄的书页里的文字将[W]我对家族的一切认知。笔记本描述了他默默进行了四十多年的一个秘密项目——一个能够[W]数百万人生活的东西。我必须[W]他的故事，查明真相。我决定[W]他留下的每一条线索。`
                },
                {
                    en: `As I turned the pages, I learned he had been a plant scientist trying to grow food in dry lands. He believed that even the most [W] problems could be solved with enough effort. Today, there is a growing [W] that his approach was ahead of its time. My grandmother smiled. "Your grandfather," she said, "never let anyone [W] his dreams. He had a [W] belief that science belonged to everyone."`,
                    cn: `翻阅书页，我了解到他曾是一位想在干旱土地上种植粮食的植物科学家。他相信即使最[W]的问题也能通过努力解决。如今，科学界越来越达成[W]，认为他的方法超前于时代。祖母微笑着说："你祖父从不允许任何人[W]他的梦想。他对科学属于每个人有着[W]的信念。"`
                },
                {
                    en: `But the road was far from easy. Officials chose to [W] his proposals, calling them not [W] enough. They said the cost was too high. Yet he understood, [W] his limited resources, that this work mattered. He refused to [W] their judgment as final. Quietly, he kept going, believing the evidence would one day prove him right.`,
                    cn: `但这路远非坦途。官员们选择[W]他的提案，称其不够[W]，成本太高。但他心里清楚，[W]自己有限的资源，这项工作值得坚持下去。他拒绝[W]他们的判断为最终裁决，默默前行，相信证据终有一天会证明他是对的。`
                },
                {
                    en: `Then a flood destroyed most of his early test crops. The loss was [W] — years of work gone in one night. A lesser person might have turned to [W] easier goals. But not him. In the notebook he wrote: "Failure does not [W] us; it teaches us." He saw this setback not as a reason to stop, but as something that could [W] an even deeper understanding of the problem.`,
                    cn: `接着一场洪水摧毁了他大部分早期试验作物。损失是[W]的——多年心血一夜化为乌有。换作别人，可能会转向[W]更简单的目标。但他没有。他在笔记本中写道："失败不会[W]我们；失败教会我们。"他把这次挫折不是看作放弃的理由，而是看作能够[W]对问题更深理解的机会。`
                },
                {
                    en: `The turning point came on an ordinary Tuesday in spring. After testing hundreds of plant types, he found one that grew with almost no water. This was an [W] moment. He had managed to [W] what experts said was impossible. Slowly, other scientists began to [W] his methods. The work also started to [W] attention from international research groups.`,
                    cn: `转折点出现在春天一个平凡的星期二。测试了数百种植物后，他终于找到一种几乎不需要水就能生长的品种。这是一个[W]的时刻。他成功[W]了专家们所说的不可能。慢慢地，其他科学家开始[W]他的方法。这项工作也开始[W]国际研究团体的关注。`
                },
                {
                    en: `Today, his crops help feed communities across three countries. The technology has taken on a [W] of its own. What was once a lonely dream has become a [W] answer to hunger in dry lands. His work proves that science must always [W] human needs first. As one expert wrote, his contribution truly [W] the strongest recognition.`,
                    cn: `如今，他的作物帮助三个国家的社区解决了粮食问题。这项技术已经形成了自己的[W]。曾经孤独的梦想已经成为干旱地区饥饿问题的[W]答案。他的工作证明，科学必须始终[W]人类需求。正如一位专家所写，他的贡献[W]最高的认可。`
                },
                {
                    en: `Sitting in that dusty attic, I saw my own life differently. For years I had felt [W] about my path. But his story taught me never to [W] myself by what others say. One person with a strong idea can [W] the world. His life was proof that real change is always [W] when you are willing to work for it. No dream is out of reach.`,
                    cn: `坐在布满灰尘的阁楼里，我重新审视自己的人生。多年来我对自己的道路感到[W]。但他的故事教会我永远不要用他人的评价来[W]自己。一个怀有坚定想法的人可以[W]世界。他的一生证明，只要你愿意为之努力，真正的改变永远是[W]的。没有什么梦想是遥不可及的。`
                },
                {
                    en: `I closed the notebook and made a choice. I would go back to school and study plant science. His journey showed me that learning is about finding something that [W] you to do better for the world. A [W] curiosity, he once wrote, is the most powerful force on earth. May his words inspire my own children someday, just as they did for me in that quiet attic.`,
                    cn: `我合上笔记本，做出了选择。我要重返校园学习植物科学。他的旅程告诉我，学习的意义在于找到能[W]你为世界做点什么的那件事。他曾写道，[W]的好奇心是地球上最强大的力量。愿他的话有朝一日也能激励我自己的孩子，就像在安静的阁楼里对我做的那样。`
                },
            ];

            const paras = [];

            for (const tpl of paraTemplates) {
                const enWords = [];
                // 填充英文模板
                let enHtml = tpl.en.replace(/\[W\]/g, () => {
                    const w = take();
                    if (w) enWords.push(w);
                    return w ? use(w) : '';
                });
                enHtml = enHtml.replace(/\s{2,}/g, ' ').replace(/\s([.,;:!?])/g, '$1').trim();

                // 用相同顺序的词汇/短语填充中文模板
                let wordIdx = 0;
                let cnHtml = tpl.cn.replace(/\[W\]/g, () => {
                    const w = enWords[wordIdx++];
                    return w ? `<strong style="color:var(--accent);">${escapeHtml(w.cn)}</strong>` : '…';
                });
                cnHtml = cnHtml.replace(/\s{2,}/g, ' ').trim();

                paras.push({ en: enHtml, cn: cnHtml });
            }

            const articleHTML = `<h3>📖 The Scientist's Notebook</h3>`
                + paras.map((p, i) => {
                    // Wrap plain words in each paragraph with click handlers
                    let result = '';
                    let lastIdx = 0;
                    const regex = /<span class="word-highlight"[^>]*>.*?<\/span>/g;
                    let match;
                    let enText = p.en;
                    while ((match = regex.exec(enText)) !== null) {
                        if (match.index > lastIdx) result += wrapPlainWords(enText.slice(lastIdx, match.index));
                        result += match[0];
                        lastIdx = match.index + match[0].length;
                    }
                    if (lastIdx < enText.length) result += wrapPlainWords(enText.slice(lastIdx));
                    return `<p>${result}</p>
                <button class="para-translate-btn" onclick="toggleParaTranslation(event, ${i})">📝 显示翻译</button>
                <div class="para-translation" id="paraTrans${i}">${p.cn}</div>`;
                }).join('');

            document.getElementById('articleCard').innerHTML = articleHTML;
        }

        // ========== 语音朗读 ==========
        let currentUtterance = null;
        let currentSpeakerBtn = null;

        function stopSpeaking() {
            if (currentUtterance || listenIsPlaying) {
                speechSynthesis.cancel();
            }
            cleanupSpeech();
            if (listenIsPlaying) stopListenPlay();
        }

        function speak(text, btnId) {
            // 如果正在朗读同一内容，则停止
            if (currentUtterance && currentSpeakerBtn && currentSpeakerBtn.id === btnId) {
                stopSpeaking();
                return;
            }

            // 停止之前的朗读
            stopSpeaking();

            // 清理文本中的 HTML 标签
            const cleanText = text.replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, '');

            if (!cleanText.trim()) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;

            const voices = speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            const btn = document.getElementById(btnId);
            if (btn) {
                currentSpeakerBtn = btn;
                btn.classList.add('speaking');
            }

            // 仅文章朗读时显示提示
            if (btnId === 'speakerArticle') {
                const hint = document.getElementById('articleSpeakingHint');
                if (hint) hint.style.display = 'inline';
            }

            utterance.onend = () => {
                cleanupSpeech();
            };

            utterance.onerror = () => {
                cleanupSpeech();
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);
        }

        function cleanupSpeech() {
            if (currentSpeakerBtn) {
                currentSpeakerBtn.classList.remove('speaking');
                currentSpeakerBtn = null;
            }
            currentUtterance = null;
            const hint = document.getElementById('articleSpeakingHint');
            if (hint) hint.style.display = 'none';
        }

        function speakWord() {
            const word = document.getElementById('wordEnglish').textContent;
            speak(word, 'speakerWord');
        }

        function speakDefinition() {
            const def = document.getElementById('enDefinition').textContent || document.getElementById('enDefinition').innerText;
            speak(def, 'speakerDef');
        }

        function speakExample() {
            const example = document.getElementById('exampleEn').textContent;
            speak(example, 'speakerExample');
        }

        function speakArticle() {
            const article = document.getElementById('articleCard');
            if (!article) return;
            const text = article.textContent;
            document.getElementById('articleSpeakingHint').style.display = 'inline';
            speak(text, 'speakerArticle');
        }

        // 预加载语音列表
        if ('speechSynthesis' in window) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
        }

        // ========== 键盘导航 ==========
        document.addEventListener('keydown', (e) => {
            const learnVisible = document.getElementById('learnPage').style.display === 'flex';
            if (!learnVisible) return;
            if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
            else if (e.key === ' ') { e.preventDefault(); toggleChinese(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); toggleExampleCn(); }
        });

        // ========== 初始化 ==========
        renderHistory();
    </script>
</body>
