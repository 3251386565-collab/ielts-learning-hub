<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习 - 雅思高频词汇</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #2d2d3a;
            --text-muted: #8e8e9a;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --border: #e8e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.08);
            --green: #00b894;
            --pink: #fd79a8;
            --orange: #fdcb6e;
            --teal: #00cec9;
            --red: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 700;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ========== 页面公共动画 ========== */
        @keyframes pageFadeIn {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .cover-page, .learn-page, .complete-page, .challenge-page, .listen-page {
            animation: pageFadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .learn-page.active, .complete-page.active, .challenge-page.active, .listen-page.active {
            animation: pageFadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardSlideUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .word-card {
            animation: cardSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease; }
        .stat-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: var(--shadow-lg); }

        /* ========== 封面页 ========== */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            width: 90%;
            max-width: 640px;
            text-align: center;
            padding: 2.5rem 0;
        }
        .cover-page h1 {
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1.25;
            background: linear-gradient(135deg, #2d2d3a 0%, #6c5ce7 60%, #fd79a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-wrapper { position: relative; display: inline-flex; }
        .btn-ring {
            position: absolute; inset: -6px;
            border-radius: 999px;
            border: 2px solid rgba(108, 92, 231, 0.2);
            animation: ringPulse 2.5s ease-out infinite;
            pointer-events: none;
        }
        .btn-ring:nth-child(2) { animation-delay: 0.8s; }
        .btn-start {
            position: relative;
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 1.3rem 3.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1.3rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .btn-start:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 48px rgba(108, 92, 231, 0.4); }
        .btn-start:active { transform: translateY(0) scale(0.97); }
        .btn-start .btn-arrow { font-size: 1.4rem; transition: transform 0.3s ease; }
        .btn-start:hover .btn-arrow { transform: translateX(5px); }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.22); opacity: 0; }
        }

        /* ========== 历史记录区域 ========== */
        .history-section {
            width: 100%;
            text-align: left;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .history-header h3 {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .history-header .history-count {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            background: #eeeef2;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        .history-empty {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            background: #f8f8fc;
            border-radius: 1.2rem;
            border: 1.5px dashed var(--border);
        }
        .history-empty .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        .history-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.2rem;
            padding: 1rem 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .history-card:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px) scale(1.01);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .history-card .h-icon {
            width: 48px;
            height: 48px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .history-card:nth-child(5n+1) .h-icon { background: #f3f0ff; }
        .history-card:nth-child(5n+2) .h-icon { background: #e6fffa; }
        .history-card:nth-child(5n+3) .h-icon { background: #fff8e1; }
        .history-card:nth-child(5n+4) .h-icon { background: #ffeef5; }
        .history-card:nth-child(5n+5) .h-icon { background: #e8f4fd; }

        .history-card .h-info { flex: 1; min-width: 0; }
        .history-card .h-date {
            font-size: 0.9rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.15rem;
        }
        .history-card .h-meta {
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 0.6rem;
            flex-wrap: wrap;
        }
        .history-card .h-meta span {
            display: flex; align-items: center; gap: 0.2rem;
        }
        .history-card .h-arrow {
            font-size: 1.2rem;
            color: #ccc;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .history-card:hover .h-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        .history-card .h-delete {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 0.3rem;
        }
        .history-card .h-delete:hover {
            color: #e74c3c;
            background: #fff5f5;
            border-color: #ffd0d0;
            transform: scale(1.1);
        }

        .history-card .h-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.35rem;
        }
        .history-card .h-tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            background: #f3f0ff;
            color: var(--accent);
        }

        /* ========== 学习页 ========== */
        .learn-page {
            display: none;
            flex-direction: column; align-items: center;
            width: 90%; max-width: 640px;
            padding: 1.5rem 0 2rem;
        }
        .learn-page.active { display: flex; }
        .top-bar {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .word-counter { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.04em; }
        .word-counter strong { color: var(--accent); font-weight: 900; font-size: 1.05rem; }

        .mini-progress-wrapper { position: relative; flex: 1; margin: 0 1.2rem; }
        .mini-progress {
            height: 6px;
            background: #eeeef2; border-radius: 999px;
            overflow: hidden; cursor: pointer;
            transition: all 0.2s ease;
        }
        .mini-progress:hover { box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08); transform: scaleY(1.6); }
        .mini-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--teal));
            border-radius: 999px;
            transition: width 0.4s ease;
        }
        .number-grid-popup {
            position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 1.2rem; padding: 1rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            z-index: 100; display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem; min-width: 300px;
        }
        .number-grid-popup.open {
            display: grid;
            animation: popIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) translateY(8px) scale(1); }
        }
        .number-grid-popup .grid-num {
            width: 100%; aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem; font-weight: 800;
            color: var(--text-muted); background: #f8f8fc;
            border: 1.5px solid transparent;
            border-radius: 0.6rem; cursor: pointer;
            transition: all 0.2s ease;
        }
        .number-grid-popup .grid-num {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .number-grid-popup .grid-num:hover {
            color: var(--accent); background: #f3f0ff;
            border-color: var(--accent-light);
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.12);
        }
        .number-grid-popup .grid-num.active {
            color: #fff; background: var(--accent); border-color: var(--accent);
            transform: scale(1.05);
        }

        .exit-btn {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem; font-weight: 800;
            color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease; background: #fff;
        }
        .exit-btn:hover { color: var(--accent); border-color: var(--accent); }

        .word-card {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 2.2rem 2rem;
            box-shadow: var(--shadow);
            text-align: center; position: relative;
        }

        .type-tag {
            display: inline-block;
            font-size: 0.78rem; font-weight: 800;
            padding: 0.3rem 1rem;
            border-radius: 999px; letter-spacing: 0.06em;
            margin-bottom: 0.8rem;
        }
        .type-tag.word { background: #f3f0ff; color: var(--accent); }
        .type-tag.phrase { background: #e6fffa; color: #00a085; }

        .word-english-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
        }
        .word-english {
            font-size: 2.6rem; font-weight: 900;
            color: var(--text); letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .word-english.phrase-text { font-size: 1.8rem; }
        .word-phonetic { font-size: 1rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1.5rem; }

        /* 喇叭按钮 */
        .speaker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid #e0e0e8;
            background: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            color: var(--text-muted);
            line-height: 1;
        }
        .speaker-btn:hover {
            border-color: var(--accent-light);
            color: var(--accent);
            background: #f8f7ff;
            transform: scale(1.08);
        }
        .speaker-btn:active { transform: scale(0.94); }
        .speaker-btn.speaking {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
            animation: speakerPulse 0.6s ease-in-out infinite;
        }
        @keyframes speakerPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(108, 92, 231, 0); }
        }
        .speaker-btn-sm {
            width: 30px; height: 30px;
            font-size: 0.85rem;
            border-width: 1.5px;
        }
        .speaker-btn-lg {
            width: 46px; height: 46px;
            font-size: 1.3rem;
        }

        .en-definition-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 1.4rem;
        }
        .en-definition-row .en-definition {
            flex: 1;
            margin-bottom: 0;
        }
        .en-definition-row .speaker-btn {
            margin-top: 0.6rem;
        }

        .example-en-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .example-en-row .example-en {
            flex: 1;
            margin-bottom: 0.5rem;
        }
        .example-en-row .speaker-btn {
            margin-top: 0.15rem;
        }

        .article-speaker-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .section-label {
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--accent-light); margin-bottom: 0.4rem;
        }

        .en-definition {
            font-size: 1.05rem; font-weight: 700;
            color: var(--text); margin-bottom: 1.4rem;
            line-height: 1.5; padding: 0.8rem 1.2rem;
            background: #f8f7ff; border-radius: 1rem;
            border-left: 4px solid var(--accent-light);
        }

        .cn-definition-wrapper {
            position: relative;
            margin-bottom: 0.3rem;
            padding: 0.8rem 1.2rem;
            background: #fffaef; border-radius: 1rem;
            border-left: 4px solid var(--orange);
            min-height: 3rem;
            display: flex; align-items: center; justify-content: center;
        }
        .cn-definition {
            font-size: 1.05rem; font-weight: 800;
            color: var(--text);
            transition: filter 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cn-definition.blurred { filter: blur(7px); opacity: 0.12; user-select: none; }
        .doodle-cover {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            border-radius: 1rem; overflow: hidden;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        .doodle-cover.fading { opacity: 0; }
        .doodle-cover svg { width: 100%; height: 100%; position: absolute; }

        .reveal-btn {
            display: flex; width: fit-content;
            align-items: center; gap: 0.3rem;
            padding: 0.4rem 1rem;
            margin-left: auto;
            font-family: 'Nunito', sans-serif;
            font-size: 0.78rem; font-weight: 800;
            color: var(--orange); background: #fff;
            border: 2px solid #ffeaa7; border-radius: 999px;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
            margin-top: 0.3rem;
            margin-bottom: 1.2rem;
        }
        .reveal-btn:hover { background: #fff8e1; border-color: var(--orange); transform: scale(1.04); }
        .reveal-btn.showing { color: #00b894; border-color: #b2f0e2; background: #f0fdf9; }

        .example-box {
            background: #f0fdf9;
            border-radius: 1rem;
            border-left: 4px solid var(--green);
            padding: 1rem 1.2rem;
            text-align: left;
            position: relative;
        }
        .example-en {
            font-size: 1.05rem; font-weight: 700;
            color: var(--text);
            line-height: 1.9;
            margin-bottom: 0.5rem;
            cursor: default;
        }
        /* 全局可点击单词样式 */
        .word-clickable {
            cursor: pointer;
            border-radius: 0.22rem;
            padding: 0 2px;
            position: relative;
            display: inline-block;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .word-clickable:hover {
            background: rgba(108, 92, 231, 0.13);
            transform: scale(1.08) translateY(-1px);
            box-shadow: 0 2px 6px rgba(108, 92, 231, 0.1);
            z-index: 1;
        }
        .word-clickable:active {
            transform: scale(0.95);
            transition: all 0.08s ease;
        }
        .example-en .word-highlight {
            color: #e74c3c; font-weight: 900;
            background: #fff5f5; padding: 0.1rem 0.3rem;
            border-radius: 0.35rem;
            border-bottom: 2px solid rgba(231, 76, 60, 0.3);
        }

        .example-cn-wrapper {
            position: relative;
            padding: 0.5rem 0.8rem;
            background: #fffdf5; border-radius: 0.6rem;
            min-height: 2rem;
            display: flex; align-items: center;
        }
        .example-cn {
            font-size: 0.9rem; font-weight: 600;
            color: var(--text-muted);
            transition: filter 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .example-cn.blurred { filter: blur(5px); opacity: 0.12; user-select: none; }
        .doodle-cover-example {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            border-radius: 0.6rem; overflow: hidden;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        .doodle-cover-example.fading { opacity: 0; }
        .doodle-cover-example svg { width: 100%; height: 100%; position: absolute; }
        .reveal-btn-example {
            display: flex; width: fit-content;
            align-items: center; gap: 0.25rem;
            padding: 0.3rem 0.8rem;
            margin-left: auto;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem; font-weight: 800;
            color: var(--green); background: #fff;
            border: 2px solid #b2f0e2; border-radius: 999px;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
            margin-top: 0.3rem;
        }
        .reveal-btn-example:hover { background: #f0fdf9; border-color: var(--green); transform: scale(1.04); }
        .reveal-btn-example.showing { color: #e74c3c; border-color: #ffcccc; background: #fff5f5; }

        /* 段落翻译按钮 */
        .para-translate-btn {
            display: inline-flex;
            align-items: center; gap: 0.25rem;
            padding: 0.3rem 0.8rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem; font-weight: 800;
            color: var(--accent); background: #fff;
            border: 2px solid var(--accent-light);
            border-radius: 999px;
            cursor: pointer; transition: all 0.25s ease;
            margin-top: 0.3rem;
        }
        .para-translate-btn:hover { background: #f8f7ff; border-color: var(--accent); transform: scale(1.04); }
        .para-translate-btn.showing { color: var(--teal); border-color: #b2f0e2; background: #f0fdf9; }

        .para-translation {
            display: none;
            margin-top: 0.5rem;
            padding: 0.7rem 1rem;
            background: #f0fdf9;
            border-radius: 0.8rem;
            border-left: 3px solid var(--teal);
            font-size: 0.9rem; font-weight: 600;
            color: var(--text);
            line-height: 1.8;
            animation: fadeIn 0.3s ease;
        }
        .para-translation.visible { display: block; }

        /* 词译弹窗 */
        .word-tooltip {
            position: fixed; z-index: 9999; pointer-events: none;
            opacity: 0; transform: translateY(10px) scale(0.92);
            transition: opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .word-tooltip.visible {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
        }
        .word-tooltip-inner {
            background: #2d2d3a; color: #fff;
            padding: 0.6rem 1rem; border-radius: 0.9rem;
            font-size: 0.85rem; font-weight: 700;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            text-align: center;
            backdrop-filter: blur(10px);
            line-height: 1.5;
        }
        .word-tooltip-inner strong { color: #74b9ff; }
        .word-tooltip-inner .tooltip-original {
            font-size: 0.72rem; color: rgba(255,255,255,0.55);
            margin-bottom: 0.1rem; font-weight: 600;
        }
        .word-tooltip-arrow {
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid #2d2d3a;
            margin: 0 auto;
        }

        /* 导航 */
        .nav-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
        }
        .nav-area .nav-left { display: flex; align-items: center; gap: 0.6rem; }
        .btn-prev {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.9rem 1.8rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem; font-weight: 900;
            color: var(--text-muted); background: #fff;
            border: 2px solid var(--border); border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
        }
        .btn-prev:hover { color: var(--accent); border-color: var(--accent-light); transform: translateY(-2px); }
        .btn-prev:active { transform: scale(0.97); }
        .btn-prev.hidden-nav { visibility: hidden; }

        .btn-back-article {
            display: none;
            align-items: center; gap: 0.3rem;
            padding: 0.9rem 1.4rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem; font-weight: 900;
            color: var(--orange); background: #fff;
            border: 2px solid #ffeaa7; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
        }
        .btn-back-article.visible { display: inline-flex; }
        .btn-back-article:hover { background: #fff8e1; border-color: var(--orange); transform: translateY(-2px); }

        .btn-next {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.9rem 2rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-next:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-next:active { transform: scale(0.97); }
        .btn-next .next-arrow { font-size: 1.2rem; transition: transform 0.3s ease; }
        .btn-next:hover .next-arrow { transform: translateX(4px); }
        .btn-next.finish {
            background: linear-gradient(135deg, var(--accent), #e74c3c);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35);
            animation: finishGlow 1.5s ease-in-out infinite;
        }
        @keyframes finishGlow {
            0%, 100% { box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35); }
            50% { box-shadow: 0 8px 36px rgba(231, 76, 60, 0.5); }
        }

        /* ========== 挑战页 ========== */
        .challenge-page {
            display: none;
            flex-direction: column; align-items: center;
            width: 90%; max-width: 740px;
            padding: 1.5rem 0 2rem;
        }
        .challenge-page.active { display: flex; }
        .challenge-header { text-align: center; margin-bottom: 1.5rem; }
        .challenge-header .challenge-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e74c3c, #fd79a8);
            color: #fff;
            font-size: 0.85rem; font-weight: 900;
            padding: 0.4rem 1.5rem;
            border-radius: 999px; letter-spacing: 0.08em;
            margin-bottom: 0.8rem;
        }
        .challenge-header h2 { font-size: 2rem; font-weight: 900; color: var(--text); line-height: 1.3; }
        .challenge-header p { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-top: 0.3rem; }

        .word-bank {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .word-bank .bank-title {
            font-size: 0.8rem; font-weight: 800;
            color: var(--text-muted); letter-spacing: 0.08em;
            text-transform: uppercase; margin-bottom: 0.6rem;
        }
        .word-bank .bank-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .bank-tag {
            font-size: 0.75rem; font-weight: 800;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            background: #fff5f5; color: #e74c3c;
            border: 1.5px solid #ffe0e0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .bank-tag {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bank-tag:hover {
            background: #ffe0e0;
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.15);
        }

        .article-card {
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
            line-height: 2.1;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
        }
        .article-card h3 { font-size: 1.3rem; font-weight: 900; margin-bottom: 1rem; color: var(--text); }
        .article-card p { margin-bottom: 0.8rem; }

        .article-card .word-highlight {
            color: #e74c3c; font-weight: 900;
            background: #fff5f5; padding: 0.15rem 0.35rem;
            border-radius: 0.35rem;
            border-bottom: 2px solid rgba(231, 76, 60, 0.3);
            cursor: pointer; transition: all 0.2s ease;
            position: relative;
        }
        .article-card .word-highlight {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .article-card .word-highlight:hover {
            background: #ffe0e0;
            box-shadow: 0 3px 12px rgba(231, 76, 60, 0.25);
            transform: translateY(-2px) scale(1.03);
        }
        .article-card .word-highlight::after {
            content: '📖'; font-size: 0.65rem;
            position: absolute; top: -8px; right: -4px;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .article-card .word-highlight:hover::after { opacity: 1; }

        .article-card .word-clickable { }

        .challenge-nav { width: 100%; display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
        .btn-again {
            padding: 0.9rem 2.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-again:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }

        /* ========== 完成页 ========== */
        .complete-page {
            display: none;
            flex-direction: column; align-items: center;
            gap: 2rem; text-align: center;
            width: 90%; max-width: 500px;
        }
        .complete-page.active { display: flex; }
        .complete-icon { font-size: 5rem; animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
        .complete-page h2 { font-size: 2rem; font-weight: 900; color: var(--text); }
        .complete-page .complete-stats { font-size: 1.05rem; font-weight: 700; color: var(--text-muted); line-height: 1.8; }
        .complete-page .complete-stats strong { color: var(--accent); font-weight: 900; }
        .btn-restart {
            padding: 0.9rem 2.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-restart-outline {
            background: #fff !important; color: var(--text-muted) !important;
            border: 2px solid var(--border) !important; box-shadow: none !important;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .cover-page h1 { font-size: 1.7rem; }
            .word-english { font-size: 1.9rem; }
            .word-english.phrase-text { font-size: 1.4rem; }
            .word-card { padding: 1.5rem 1.2rem; }
            .article-card { padding: 1.5rem 1.2rem; font-size: 0.9rem; }
            .btn-prev, .btn-next { padding: 0.7rem 1.4rem; font-size: 0.85rem; }
        }

        /* ========== 选择弹窗 ========== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal-card {
            background: #fff;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .modal-card h3 {
            font-size: 1.4rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.5rem;
        }
        .modal-card .modal-desc {
            font-size: 0.85rem; font-weight: 700;
            color: var(--text-muted); margin-bottom: 2rem;
        }
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .modal-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.5rem;
            border: 2px solid var(--border);
            border-radius: 1.2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #fff;
            text-align: left;
            font-family: 'Nunito', sans-serif;
        }
        .modal-option:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px) scale(1.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-option .opt-icon {
            width: 50px; height: 50px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .modal-option:nth-child(1) .opt-icon { background: #f3f0ff; }
        .modal-option:nth-child(2) .opt-icon { background: #e6fffa; }
        .modal-option .opt-info { flex: 1; }
        .modal-option .opt-title {
            font-size: 1rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.15rem;
        }
        .modal-option .opt-sub {
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-muted);
        }
        .modal-close {
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem; font-weight: 800;
            color: var(--text-muted); background: none;
            border: none; cursor: pointer;
        }
        .modal-close:hover { color: var(--text); }

        /* ========== 听力页 ========== */
        .listen-page {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 700px;
            padding: 1.5rem 0 2rem;
        }
        .listen-page.active { display: flex; }

        .listen-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .listen-source-tag {
            display: inline-block;
            font-size: 0.75rem; font-weight: 900;
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            letter-spacing: 0.06em;
        }
        .listen-source-tag.real { background: #ffe0e0; color: #c0392b; }
        .listen-source-tag.mock { background: #fff3e0; color: #e67e22; }

        .listen-card {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }
        .listen-card h3 {
            font-size: 1.2rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.5rem;
        }
        .listen-card .listen-instruction {
            font-size: 0.85rem; font-weight: 700;
            color: var(--text-muted); margin-bottom: 1.2rem;
            line-height: 1.5;
        }
        .listen-questions {
            background: #fafafa;
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
        }
        .listen-questions h4 {
            font-size: 0.85rem; font-weight: 900;
            color: var(--accent); margin-bottom: 0.8rem;
            letter-spacing: 0.06em;
        }
        .listen-questions .q-item {
            font-size: 0.9rem; font-weight: 700;
            color: var(--text); margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        .listen-questions .q-item .q-num {
            display: inline-block;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem; font-weight: 900;
            text-align: center; line-height: 24px;
            margin-right: 0.4rem;
        }

        .listen-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .btn-listen-play {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.8rem 2rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-listen-play:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-listen-play.playing {
            background: #e74c3c;
            animation: finishGlow 1.5s ease-in-out infinite;
        }
        .btn-toggle-transcript {
            padding: 0.8rem 1.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem; font-weight: 900;
            color: var(--accent); background: #fff;
            border: 2px solid var(--accent-light);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-toggle-transcript:hover {
            background: #f8f7ff;
            transform: translateY(-2px);
        }

        .listen-transcript {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            line-height: 2;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
        }
        .listen-transcript.visible { display: block; animation: fadeIn 0.3s ease; }

        .listen-transcript .t-sentence {
            padding: 0.3rem 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
            display: inline;
        }
        .listen-transcript .t-sentence.active {
            background: #dbe9ff;
            color: #1a56db;
            font-weight: 800;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.12);
            transform: scale(1.02);
        }
        .listen-transcript .word-clickable { }

        /* 听力进度条 */
        .listen-progress-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1rem;
            width: 100%;
        }
        .listen-time {
            font-size: 0.75rem; font-weight: 700;
            color: var(--text-muted);
            min-width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .listen-progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress-pct, 0%), #e0e0e8 var(--progress-pct, 0%), #e0e0e8 100%);
            outline: none;
            cursor: pointer;
        }
        .listen-progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 10px var(--accent-glow);
            transition: transform 0.15s ease;
        }
        .listen-progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        .listen-progress-bar::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .listen-progress-bar::-moz-range-progress {
            background: var(--accent);
            height: 6px;
            border-radius: 3px;
        }

        .listen-nav {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        /* 听力历史 */
        .history-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            background: #eeeef2;
            border-radius: 999px;
            padding: 0.25rem;
        }
        .history-tab {
            flex: 1;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            border: none;
            font-family: 'Nunito', sans-serif;
            font-size: 0.82rem; font-weight: 800;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .history-tab.active {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

    <!-- ==================== 词译弹窗 ==================== -->
    <div class="word-tooltip" id="wordTooltip">
        <div class="word-tooltip-inner">
            <div class="tooltip-original" id="tooltipOriginal"></div>
            <div id="tooltipTranslation"></div>
        </div>
        <div class="word-tooltip-arrow"></div>
    </div>

    <!-- ==================== 封面页 ==================== -->
    <div class="cover-page" id="coverPage">
        <h1>你的英语学习之旅</h1>
        <div class="btn-wrapper">
            <div class="btn-ring"></div><div class="btn-ring"></div>
            <button class="btn-start" onclick="startNewSession()">
                <span>开始学习</span><span class="btn-arrow">→</span>
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
            <div class="history-header">
                <h3>📋 历史学习记录 <span class="history-count" id="historyCount">0</span></h3>
            </div>
            <div class="history-tabs">
                <button class="history-tab active" id="tabVocab" onclick="switchHistoryTab('vocab')">📖 词汇学习</button>
                <button class="history-tab" id="tabListen" onclick="switchHistoryTab('listen')">🎧 听力练习</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <div class="empty-icon">📭</div>
                    <div>还没有学习记录<br>点击上方按钮开始你的第一次学习吧！</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 听力练习页 ==================== -->
    <div class="listen-page" id="listenPage">
        <div class="listen-header">
            <span class="listen-source-tag" id="listenSourceTag"></span>
            <span style="font-size:0.8rem;font-weight:800;color:var(--text-muted);" id="listenPassageId"></span>
            <button class="exit-btn" onclick="goToCover()">✕ 退出</button>
        </div>
        <div class="listen-card">
            <h3 id="listenTitle"></h3>
            <div class="listen-instruction" id="listenInstruction"></div>
            <div class="listen-questions" id="listenQuestions"></div>
            <div class="listen-controls">
                <button class="btn-listen-play" id="btnListenPlay" onclick="toggleListenPlay()">
                    🔊 <span id="btnListenLabel">播放听力</span>
                </button>
                <button class="btn-toggle-transcript" id="btnToggleTranscript" onclick="toggleTranscript()">
                    📄 显示原文
                </button>
            </div>
            <div class="listen-progress-wrapper" id="listenProgressWrapper" style="display:none;">
                <span class="listen-time" id="listenTimeCurrent">0:00</span>
                <input type="range" class="listen-progress-bar" id="listenProgressBar" min="0" max="1000" value="0" oninput="updateProgressVisual(this.value)" onchange="seekListenProgress(this.value)" />
                <span class="listen-time" id="listenTimeTotal">0:00</span>
            </div>
        </div>
        <div class="listen-transcript" id="listenTranscript"></div>
        <div class="listen-nav">
            <button class="btn-again" onclick="goToCover()">🔄 返回主页</button>
        </div>
    </div>

    <!-- ==================== 学习页 ==================== -->
    <div class="learn-page" id="learnPage">
        <div class="top-bar">
            <span class="word-counter" id="wordCounterLabel">词汇 <strong id="currentNum">1</strong> / 30</span>
            <div class="mini-progress-wrapper">
                <div class="mini-progress" id="miniProgressBar" onclick="toggleNumberGrid(event)">
                    <div class="mini-progress-fill" id="miniProgressFill" style="width:3.33%"></div>
                </div>
                <div class="number-grid-popup" id="numberGrid"></div>
            </div>
            <button class="exit-btn" onclick="goToCover()">✕ 退出</button>
        </div>
        <div class="word-card">
            <div class="type-tag" id="typeTag"></div>
            <div class="word-english-row">
                <div class="word-english" id="wordEnglish"></div>

            { en: "advocate", type: "word", pos: "verb & noun", phonetic: "/ˈædvəkeɪt/", enDef: "To publicly support a policy or idea.", cn: "倡导，拥护", exampleEn: "Cialdini is not alone in advocating this strategy. Research shows that peer power, used horizontally not vertically, is much more powerful than any boss's speech.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> Cialdini并非唯一倡导这一策略的人。研究表明，横向而非纵向使用的同伴力量，比任何老板的演讲都更强大。（剑桥雅思10 · 创新的心理学）" },

            { en: "in accordance with", type: "phrase", pos: "phrase", phonetic: "/ɪn əˈkɔːdəns wɪð/", enDef: "Following or obeying a rule, law, or request.", cn: "根据，依照", exampleEn: "All clinical trials must be conducted in accordance with the ethical guidelines established by the international medical community.", exampleCn: "所有临床试验必须依照国际医学界制定的伦理准则进行。" },
            { en: "diminish", type: "word", pos: "verb", phonetic: "/dɪˈmɪnɪʃ/", enDef: "To become or make something smaller or less important.", cn: "减少，降低", exampleEn: "Prolonged exposure to high levels of noise pollution has been shown to significantly diminish cognitive performance in children.", exampleCn: "长期暴露于高水平噪音污染已被证明会显著降低儿童的认知表现。" },
            { en: "as opposed to", type: "phrase", pos: "phrase", phonetic: "/æz əˈpəʊzd tə/", enDef: "Used to contrast two different things.", cn: "与…相对，而不是", exampleEn: "The study focused on experiential learning methods, as opposed to traditional lecture-based approaches that dominate most university classrooms.", exampleCn: "这项研究关注的是体验式学习方法，而不是主导大多数大学课堂的传统讲授式方法。" },
            { en: "consensus", type: "word", pos: "noun", phonetic: "/kənˈsensəs/", enDef: "A general agreement among a group of people.", cn: "共识，一致意见", exampleEn: "There is now broad scientific consensus that human activity is the primary driver of global climate change.", exampleCn: "现在科学界已有广泛共识，即人类活动是全球气候变化的主要驱动因素。" },
            { en: "by virtue of", type: "phrase", pos: "phrase", phonetic: "/baɪ ˈvɜːtʃuː əv/", enDef: "Because of; as a result of a particular quality.", cn: "由于，凭借", exampleEn: "The company gained a significant competitive advantage by virtue of its early investment in artificial intelligence technology.", exampleCn: "该公司凭借早期对人工智能技术的投资获得了显著竞争优势。" },
            { en: "elaborate", type: "word", pos: "verb & adj", phonetic: "/ɪˈlæbərət/", enDef: "To explain something in more detail.", cn: "详细说明；精心的", exampleEn: "The researchers were asked to elaborate on the methodology they used to collect and analyse the longitudinal data.", exampleCn: "研究人员被要求详细说明他们用于收集和分析纵向数据的方法。" },
            { en: "steer clear of", type: "phrase", pos: "phrase", phonetic: "/stɪə klɪə əv/", enDef: "To avoid someone or something completely.", cn: "避开，远离", exampleEn: "Financial advisors recommend that novice investors steer clear of highly speculative assets until they understand market fundamentals.", exampleCn: "金融顾问建议新手投资者在了解市场基本面之前避开高度投机的资产。" },
            { en: "exploit", type: "word", pos: "verb", phonetic: "/ɪkˈsplɔɪt/", enDef: "To use something unfairly for your own benefit.", cn: "剥削，利用", exampleEn: "The daytime economy is already heavily exploited by other creatures such as birds. Given that there is a living to be made at night, natural selection has favoured bats that make a go of the night-hunting trade.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 白天的经济生态已被鸟类等其他生物充分占据。既然夜间可以谋生，自然选择便青睐那些成功适应夜间捕猎的蝙蝠。（剑桥雅思7 · 蝙蝠之谜）" },
            { en: "in the wake of", type: "phrase", pos: "phrase", phonetic: "/ɪn ðə weɪk əv/", enDef: "Following soon after an important event.", cn: "随着…而来，在…之后", exampleEn: "In the wake of the devastating earthquake, international aid organisations mobilised resources to provide emergency shelter and medical care.", exampleCn: "毁灭性地震发生之后，国际援助组织迅速调动资源，提供紧急避难所和医疗护理。" },
            { en: "inhibit", type: "word", pos: "verb", phonetic: "/ɪnˈhɪbɪt/", enDef: "To prevent or slow down a process or action.", cn: "抑制，阻碍", exampleEn: "Authority doesn't have to inhibit innovation but it often does. The wrong kind of leadership will lead to what Cialdini calls 'captainitis'.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 权威并不一定要抑制创新，但它常常会。错误的领导方式会导致Cialdini所谓的「机长症」。（剑桥雅思10 · 创新的心理学）" },
            { en: "at the mercy of", type: "phrase", pos: "phrase", phonetic: "/æt ðə ˈmɜːsi əv/", enDef: "Completely controlled by someone or something.", cn: "完全受…支配，任由…摆布", exampleEn: "Humanity has been at the mercy of climate change for its entire existence, with at least eight glacial episodes in the past 730,000 years.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 人类在其整个存在过程中一直受气候变化的支配，过去73万年里至少经历了八次冰期。（剑桥雅思8 · 小冰河期）" },
            { en: "intrinsic", type: "word", pos: "adjective", phonetic: "/ɪnˈtrɪnsɪk/", enDef: "Being a natural and essential part of something.", cn: "固有的，内在的", exampleEn: "Motivation that comes from genuine curiosity is considered intrinsic, as opposed to motivation driven by external rewards.", exampleCn: "源自真正好奇心的动机被认为是内在的，而不是由外部奖励驱动的动机。" },
            { en: "on the grounds that", type: "phrase", pos: "phrase", phonetic: "/ɒn ðə ɡraʊndz ðæt/", enDef: "For the reason that; because.", cn: "以…为由，因为", exampleEn: "The proposed development was rejected by the planning authority on the grounds that it would cause irreversible damage to the wetland ecosystem.", exampleCn: "规划部门拒绝了该开发提案，理由是它会对湿地生态系统造成不可逆转的破坏。" },
            { en: "mitigate", type: "word", pos: "verb", phonetic: "/ˈmɪtɪɡeɪt/", enDef: "To make something less harmful or serious.", cn: "减轻，缓和", exampleEn: "Governments worldwide are implementing carbon pricing mechanisms in an effort to mitigate the effects of greenhouse gas emissions.", exampleCn: "世界各国政府正在实施碳定价机制，以努力减轻温室气体排放的影响。" },
            { en: "in light of", type: "phrase", pos: "phrase", phonetic: "/ɪn laɪt əv/", enDef: "Because of new information or a recent event.", cn: "鉴于，考虑到", exampleEn: "In light of emerging evidence about the health risks of sedentary behaviour, many workplaces have introduced standing desks for employees.", exampleCn: "鉴于关于久坐行为健康风险的新证据不断涌现，许多工作场所已为员工引入了站立式办公桌。" },
            { en: "offset", type: "word", pos: "verb", phonetic: "/ˈɒfset/", enDef: "To balance the effect of something with an opposite effect.", cn: "抵消，补偿", exampleEn: "The carbon emissions generated by the manufacturing process were partially offset by the company's tree-planting initiative in deforested regions.", exampleCn: "制造过程中产生的碳排放被该公司在毁林地区的植树造林举措部分抵消了。" },
            { en: "lag behind", type: "phrase", pos: "phrase", phonetic: "/læɡ bɪˈhaɪnd/", enDef: "To move or develop more slowly than others.", cn: "落后，滞后", exampleEn: "Despite recent economic growth, rural areas continue to lag behind urban centres in terms of access to quality healthcare services.", exampleCn: "尽管近期经济有所增长，农村地区在获得优质医疗服务方面仍落后于城市中心。" },
            { en: "predominantly", type: "word", pos: "adverb", phonetic: "/prɪˈdɒmɪnəntli/", enDef: "Mainly; for the most part.", cn: "主要地，占主导地", exampleEn: "The participants in the longitudinal study were predominantly middle-aged professionals from urban areas with higher education qualifications.", exampleCn: "纵向研究的参与者主要是来自城市地区、具有高等教育资格的中年专业人士。" },
            { en: "fall short of", type: "phrase", pos: "phrase", phonetic: "/fɔːl ʃɔːt əv/", enDef: "To fail to reach a goal or standard.", cn: "未达到，达不到", exampleEn: "The government's ambitious housing targets fell significantly short of the actual number of affordable homes constructed each year.", exampleCn: "政府雄心勃勃的住房目标远远不及每年实际建造的可负担住房数量。" },
            { en: "prone to", type: "phrase", pos: "phrase", phonetic: "/prəʊn tə/", enDef: "Likely to suffer from or do something bad.", cn: "易于…的，倾向于…的", exampleEn: "Coastal cities built on reclaimed land are particularly prone to flooding during extreme weather events and rising sea levels.", exampleCn: "建在填海土地上的沿海城市在极端天气事件和海平面上升期间特别容易发生洪涝。" },
            { en: "retain", type: "word", pos: "verb", phonetic: "/rɪˈteɪn/", enDef: "To keep or continue to have something.", cn: "保留，保持", exampleEn: "Organisations that offer flexible working arrangements are more likely to retain talented employees in an increasingly competitive job market.", exampleCn: "在竞争日益激烈的就业市场中，提供灵活工作安排的组织更有可能留住有才能的员工。" },
            { en: "stem from", type: "phrase", pos: "phrase", phonetic: "/stem frɒm/", enDef: "To be caused by or come from a particular thing.", cn: "源于，由…引起", exampleEn: "A gradual agricultural revolution in northern Europe stemmed from concerns over food supplies at a time of rising populations.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 北欧渐进的农业革命源于人口增长时期对粮食供应的担忧。（剑桥雅思8 · 小冰河期）" },
            { en: "stringent", type: "word", pos: "adjective", phonetic: "/ˈstrɪndʒənt/", enDef: "Very strict or severe, especially about rules.", cn: "严格的，严厉的", exampleEn: "Aviation authorities have introduced more stringent safety protocols in response to the growing volume of global air traffic.", exampleCn: "航空当局为应对日益增长的全球空中交通量，引入了更严格的安全规程。" },
            { en: "shed light on", type: "phrase", pos: "phrase", phonetic: "/ʃed laɪt ɒn/", enDef: "To make something easier to understand.", cn: "阐明，揭示", exampleEn: "The archaeological discovery of ancient tools has helped shed light on the migration patterns of early human populations across continents.", exampleCn: "古代工具的考古发现有助于揭示早期人类跨大陆迁徙的模式。" },
            { en: "trigger", type: "word", pos: "verb & noun", phonetic: "/ˈtrɪɡə/", enDef: "To cause something to start or happen suddenly.", cn: "触发，引起", exampleEn: "The unprecedented land clearance released vast quantities of carbon dioxide into the atmosphere, triggering for the first time humanly caused global warming.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 史无前例的土地开垦向大气释放了大量二氧化碳，首次引发了人为的全球变暖。（剑桥雅思8 · 小冰河期）" },
            { en: "utilize", type: "word", pos: "verb", phonetic: "/ˈjuːtɪlaɪz/", enDef: "To use something in an effective way.", cn: "利用，使用", exampleEn: "Engineers are developing innovative ways to utilize geothermal energy as a reliable and sustainable alternative to fossil fuels.", exampleCn: "工程师们正在开发创新方法来利用地热能，作为化石燃料的可靠且可持续的替代品。" },
            { en: "with the exception of", type: "phrase", pos: "phrase", phonetic: "/wɪð ðə ɪkˈsepʃən əv/", enDef: "Not including one particular person or thing.", cn: "除…之外", exampleEn: "With the exception of a brief recession in the early 1990s, the country experienced uninterrupted economic expansion for over four decades.", exampleCn: "除20世纪90年代初的短暂衰退外，该国经历了四十多年不间断的经济扩张。" },

            // 第二批 31-60: 学术形容词与话题词汇

            { en: "back up", type: "phrase", pos: "phrase", phonetic: "/bæk ʌp/", enDef: "To provide evidence to support an idea or claim.", cn: "支持，证实", exampleEn: "Researchers must provide robust statistical evidence to back up any claims about the effectiveness of a new medical treatment.", exampleCn: "研究人员必须提供可靠的统计证据来支持关于新医疗方法有效性的任何说法。" },
            { en: "compelling", type: "word", pos: "adjective", phonetic: "/kəmˈpelɪŋ/", enDef: "Very convincing or so interesting that you must pay attention.", cn: "令人信服的；引人入胜的", exampleEn: "The documentary presented compelling evidence that plastic pollution in the oceans has reached crisis levels.", exampleCn: "这部纪录片提出了令人信服的证据，表明海洋塑料污染已达到危机水平，需要立即开展国际合作。" },
            { en: "come into force", type: "phrase", pos: "phrase", phonetic: "/kʌm ˈɪntə fɔːs/", enDef: "To officially start to apply (for a law or rule).", cn: "生效，开始实施", exampleEn: "Their powers to vote down executive remuneration policies increased when binding votes came into force.", exampleCn: "📋 <b style='color:#e74c3c'>真题</b> 当具有约束力的投票生效后，他们否决高管薪酬政策的权力也随之增强。（剑桥雅思12 · 英国公司董事治理）" },
            { en: "detrimental", type: "word", pos: "adjective", phonetic: "/ˌdetrɪˈmentl/", enDef: "Causing harm or damage.", cn: "有害的，不利的", exampleEn: "Studies have consistently shown that prolonged social isolation can be as detrimental to physical health as smoking fifteen cigarettes a day.", exampleCn: "研究一再表明，长期的社交孤立对身体健康的有害程度相当于每天吸十五支烟。" },

        // ========== 状态管理 ==========
        const SESSION_SIZE = 30;

        // ========== localStorage ==========
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('ielts_history') || '[]'); }
            catch (e) { return []; }
        }
        function saveHistory(history) {
            localStorage.setItem('ielts_history', JSON.stringify(history));
        }

        // 获取所有已被历史使用的词汇索引
        function getUsedWordIndices() {
            const history = getHistory();
            const used = new Set();
            history.forEach(h => {
                if (h.wordIndices) h.wordIndices.forEach(i => used.add(i));
            });
            return used;
        }

        // 真题例句索引（14条来自剑桥雅思真题系列）
        const REAL_EXAM_INDICES = new Set([0, 10, 12, 13, 24, 27, 33, 45, 52, 55, 64, 80, 88, 96]);

        // 从主词库中选取 N 个未曾使用的词汇（确保 ≥10% 来自雅思真题）
        function pickNewWords(count) {
            const used = getUsedWordIndices();
            const available = [];
            const realExamAvail = [];
            masterVocabulary.forEach((_, i) => {
                if (!used.has(i)) {
                    available.push(i);
                    if (REAL_EXAM_INDICES.has(i)) realExamAvail.push(i);
                }
            });

            // 如果可用词汇不足，则重置历史
            if (available.length < count) {
                if (confirm('所有词汇都已学过！是否清除历史记录以重新开始？')) {
                    localStorage.removeItem('ielts_history');
                    return pickNewWords(count);
                }
            }

            // 至少 10% 必须来自雅思真题（30个中至少3个）
            const minReal = Math.max(1, Math.floor(count / 10));
            const shuffled = [...available].sort(() => Math.random() - 0.5);
            const shuffledReal = [...realExamAvail].sort(() => Math.random() - 0.5);

            const selected = new Set();
            const realToTake = Math.min(minReal, shuffledReal.length);
            for (let i = 0; i < realToTake; i++) selected.add(shuffledReal[i]);
            for (const idx of shuffled) {
                if (selected.size >= count) break;
                selected.add(idx);
            }
            return [...selected].sort(() => Math.random() - 0.5);
        }

        // 根据词汇索引数组构建当前词汇表
        function buildVocabulary(indices) {
            return indices.map(i => masterVocabulary[i]);

        // ========== 渲染历史记录 ==========

            document.getElementById('tabListen').classList.toggle('active', tab === 'listen');
            renderHistory();
        }

            const history = isVocab ? getHistory() : getListenHistory();
            const list = document.getElementById('historyList');
            const countEl = document.getElementById('historyCount');

            if (history.length === 0) {

                        <div>还没有${label}记录<br>点击上方按钮开始你的第一次学习吧！</div>

                return;
            }

            const sorted = [...history].reverse();

            if (isVocab) {
                // 词汇历史渲染
                list.innerHTML = sorted.map((h, i) => {
                    const date = new Date(h.timestamp);
                    const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
                    const timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                    const previewWords = (h.wordIndices || []).slice(0, 5).map(idx => masterVocabulary[idx]?.en || '');
                    const iconEmojis = ['📚', '📖', '📝', '🌟', '💡'];
                    const icon = iconEmojis[sorted.length - 1 - i % iconEmojis.length];
                    return `
                        <div class="history-card" onclick="relearnHistory('${h.id}')">
                            <div class="h-icon">${icon}</div>

                                </div>

                            <span class="h-arrow">→</span>

        function startListenPlay() {
            if (!currentPassage) return;
            stopSpeaking();
            listenIsPlaying = true;

            const btn = document.getElementById('btnListenPlay');
            btn.classList.add('playing');
            document.getElementById('btnListenLabel').textContent = '停止播放';

            // 显示进度条

        function speakFromSentence(startIdx) {
            // 清除之前的定时器和语音（先解绑回调，防止 cancel 触发 stopListenPlay）
            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
            }
            speechSynthesis.cancel();
            listenTimers.forEach(t => clearTimeout(t));
            listenTimers = [];
            if (listenProgressInterval) clearInterval(listenProgressInterval);

            listenSentenceIndex = startIdx;
            const sentences = currentPassage.sentences;
            const remainingSentences = sentences.slice(startIdx);

            // 计算全文字数和时间
            const allWordCounts = sentences.map(s => s.split(' ').length);
            const totalWords = allWordCounts.reduce((a, b) => a + b, 0);
            const wordsPerSec = 2.2;
            listenTotalDuration = (totalWords / wordsPerSec) * 1000;

            // 计算每句的起始时间（ms）
            listenSentenceStartTimes = [];
            let elapsed = 0;
            for (let i = 0; i < sentences.length; i++) {
                listenSentenceStartTimes.push(elapsed);
                elapsed += (allWordCounts[i] / totalWords) * listenTotalDuration;
            }

            // 设置进度条最大值
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar) {
                progressBar.max = 1000;
                progressBar.value = Math.round((listenSentenceStartTimes[startIdx] / listenTotalDuration) * 1000);
            }
            document.getElementById('listenTimeTotal').textContent = formatTime(listenTotalDuration / 1000);

            // 从 startIdx 开始播放
            const remainingText = remainingSentences.join(' ');
            const utterance = new SpeechSynthesisUtterance(remainingText);
            utterance.lang = 'en-US';
            utterance.rate = 0.88;
            const voices = speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            listenStartTime = Date.now() - listenSentenceStartTimes[startIdx];

            // 为剩余句子设置高亮定时器
            const remainingWordCounts = allWordCounts.slice(startIdx);
            const remainingTotalWords = remainingWordCounts.reduce((a, b) => a + b, 0);
            const remainingDuration = (remainingTotalWords / wordsPerSec) * 1000;
            let timerElapsed = 0;

            for (let i = 0; i < remainingSentences.length; i++) {
                const sentenceIdx = startIdx + i;
                const delay = timerElapsed;
                const timerId = setTimeout(() => {
                    if (!listenIsPlaying) return;
                    listenSentenceIndex = sentenceIdx;
                    highlightTranscriptSentence(sentenceIdx);
                }, delay);
                listenTimers.push(timerId);
                timerElapsed += (remainingWordCounts[i] / remainingTotalWords) * remainingDuration;
            }

            utterance.onend = () => {
                stopListenPlay();
                listenTimers.forEach(t => clearTimeout(t));
                // 播放完成，进度条跳到100%
                if (progressBar) progressBar.value = 1000;
                document.getElementById('listenTimeCurrent').textContent = formatTime(listenTotalDuration / 1000);
            };
            utterance.onerror = () => {
                stopListenPlay();
                listenTimers.forEach(t => clearTimeout(t));
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);

            // 启动进度条更新
            listenProgressInterval = setInterval(updateListenProgress, 100);
        }

        function updateListenProgress() {
            if (!listenIsPlaying) return;
            const elapsed = Date.now() - listenStartTime;
            const pct = Math.min(elapsed / listenTotalDuration, 1);
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar && document.activeElement !== progressBar) {
                progressBar.value = Math.round(pct * 1000);
                progressBar.style.setProperty('--progress-pct', (pct * 100) + '%');
            }
            document.getElementById('listenTimeCurrent').textContent = formatTime(Math.min(elapsed / 1000, listenTotalDuration / 1000));
        }

        function updateProgressVisual(value) {
            const pct = parseInt(value) / 10; // 0-100
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar) {
                progressBar.style.setProperty('--progress-pct', pct + '%');
            }
            if (listenTotalDuration > 0) {
                const ms = (parseInt(value) / 1000) * listenTotalDuration;
                document.getElementById('listenTimeCurrent').textContent = formatTime(ms / 1000);
            }
        }

        function seekListenProgress(value) {
            if (!currentPassage || !listenIsPlaying) return;
            const pct = parseInt(value) / 1000;
            const targetMs = pct * listenTotalDuration;

            // 找到对应句子
            let targetIdx = 0;
            for (let i = listenSentenceStartTimes.length - 1; i >= 0; i--) {
                if (listenSentenceStartTimes[i] <= targetMs) {
                    targetIdx = i;
                    break;
                }
            }

            speakFromSentence(targetIdx);
            highlightTranscriptSentence(targetIdx);
        }

        function seekToSentence(idx) {
            if (!currentPassage) return;
            speakFromSentence(idx);
            highlightTranscriptSentence(idx);
        }

        function stopListenPlay() {
            if (!listenIsPlaying) return;
            listenIsPlaying = false;
            speechSynthesis.cancel();
            currentUtterance = null;
            listenTimers.forEach(t => clearTimeout(t));
            listenTimers = [];
            if (listenProgressInterval) { clearInterval(listenProgressInterval); listenProgressInterval = null; }
            const btn = document.getElementById('btnListenPlay');
            if (btn) {
                btn.classList.remove('playing');
                document.getElementById('btnListenLabel').textContent = '播放听力';
            }
            document.querySelectorAll('.t-sentence.active').forEach(el => el.classList.remove('active'));
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');

            document.querySelectorAll('.t-sentence.active').forEach(el => el.classList.remove('active'));

        }
