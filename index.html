<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语学习 - 雅思高频词汇</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #2d2d3a;
            --text-muted: #8e8e9a;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --border: #e8e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.08);
            --green: #00b894;
            --pink: #fd79a8;
            --orange: #fdcb6e;
            --teal: #00cec9;
            --red: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 700;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ========== 页面公共动画 ========== */
        @keyframes pageFadeIn {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .cover-page, .learn-page, .complete-page, .challenge-page, .listen-page {
            animation: pageFadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .learn-page.active, .complete-page.active, .challenge-page.active, .listen-page.active {
            animation: pageFadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardSlideUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .word-card {
            animation: cardSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease; }
        .stat-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: var(--shadow-lg); }

        /* ========== 封面页 ========== */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            width: 90%;
            max-width: 640px;
            text-align: center;
            padding: 2.5rem 0;
        }
        .cover-page h1 {
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1.25;
            background: linear-gradient(135deg, #2d2d3a 0%, #6c5ce7 60%, #fd79a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-wrapper { position: relative; display: inline-flex; }
        .btn-ring {
            position: absolute; inset: -6px;
            border-radius: 999px;
            border: 2px solid rgba(108, 92, 231, 0.2);
            animation: ringPulse 2.5s ease-out infinite;
            pointer-events: none;
        }
        .btn-ring:nth-child(2) { animation-delay: 0.8s; }
        .btn-start {
            position: relative;
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 1.3rem 3.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1.3rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .btn-start:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 48px rgba(108, 92, 231, 0.4); }
        .btn-start:active { transform: translateY(0) scale(0.97); }
        .btn-start .btn-arrow { font-size: 1.4rem; transition: transform 0.3s ease; }
        .btn-start:hover .btn-arrow { transform: translateX(5px); }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.22); opacity: 0; }
        }

        /* ========== 历史记录区域 ========== */
        .history-section {
            width: 100%;
            text-align: left;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .history-header h3 {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .history-header .history-count {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-muted);
            background: #eeeef2;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        .history-empty {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            background: #f8f8fc;
            border-radius: 1.2rem;
            border: 1.5px dashed var(--border);
        }
        .history-empty .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        .history-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.2rem;
            padding: 1rem 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .history-card:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px) scale(1.01);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .history-card .h-icon {
            width: 48px;
            height: 48px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .history-card:nth-child(5n+1) .h-icon { background: #f3f0ff; }
        .history-card:nth-child(5n+2) .h-icon { background: #e6fffa; }
        .history-card:nth-child(5n+3) .h-icon { background: #fff8e1; }
        .history-card:nth-child(5n+4) .h-icon { background: #ffeef5; }
        .history-card:nth-child(5n+5) .h-icon { background: #e8f4fd; }

        .history-card .h-info { flex: 1; min-width: 0; }
        .history-card .h-date {
            font-size: 0.9rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.15rem;
        }
        .history-card .h-meta {
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 0.6rem;
            flex-wrap: wrap;
        }
        .history-card .h-meta span {
            display: flex; align-items: center; gap: 0.2rem;
        }
        .history-card .h-arrow {
            font-size: 1.2rem;
            color: #ccc;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .history-card:hover .h-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        .history-card .h-delete {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 0.3rem;
        }
        .history-card .h-delete:hover {
            color: #e74c3c;
            background: #fff5f5;
            border-color: #ffd0d0;
            transform: scale(1.1);
        }

        .history-card .h-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.35rem;
        }
        .history-card .h-tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            background: #f3f0ff;
            color: var(--accent);
        }

        /* ========== 学习页 ========== */
        .learn-page {
            display: none;
            flex-direction: column; align-items: center;
            width: 90%; max-width: 640px;
            padding: 1.5rem 0 2rem;
        }
        .learn-page.active { display: flex; }
        .top-bar {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .word-counter { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.04em; }
        .word-counter strong { color: var(--accent); font-weight: 900; font-size: 1.05rem; }

        .mini-progress-wrapper { position: relative; flex: 1; margin: 0 1.2rem; }
        .mini-progress {
            height: 6px;
            background: #eeeef2; border-radius: 999px;
            overflow: hidden; cursor: pointer;
            transition: all 0.2s ease;
        }
        .mini-progress:hover { box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08); transform: scaleY(1.6); }
        .mini-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--teal));
            border-radius: 999px;
            transition: width 0.4s ease;
        }
        .number-grid-popup {
            position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 1.2rem; padding: 1rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            z-index: 100; display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem; min-width: 300px;
        }
        .number-grid-popup.open {
            display: grid;
            animation: popIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(12px) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) translateY(8px) scale(1); }
        }
        .number-grid-popup .grid-num {
            width: 100%; aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem; font-weight: 800;
            color: var(--text-muted); background: #f8f8fc;
            border: 1.5px solid transparent;
            border-radius: 0.6rem; cursor: pointer;
            transition: all 0.2s ease;
        }
        .number-grid-popup .grid-num {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .number-grid-popup .grid-num:hover {
            color: var(--accent); background: #f3f0ff;
            border-color: var(--accent-light);
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.12);
        }
        .number-grid-popup .grid-num.active {
            color: #fff; background: var(--accent); border-color: var(--accent);
            transform: scale(1.05);
        }

        .exit-btn {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem; font-weight: 800;
            color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease; background: #fff;
        }
        .exit-btn:hover { color: var(--accent); border-color: var(--accent); }

        .word-card {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 2.2rem 2rem;
            box-shadow: var(--shadow);
            text-align: center; position: relative;
        }

        .type-tag {
            display: inline-block;
            font-size: 0.78rem; font-weight: 800;
            padding: 0.3rem 1rem;
            border-radius: 999px; letter-spacing: 0.06em;
            margin-bottom: 0.8rem;
        }
        .type-tag.word { background: #f3f0ff; color: var(--accent); }
        .type-tag.phrase { background: #e6fffa; color: #00a085; }

        .word-english-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.2rem;
        }
        .word-english {
            font-size: 2.6rem; font-weight: 900;
            color: var(--text); letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .word-english.phrase-text { font-size: 1.8rem; }
        .word-phonetic { font-size: 1rem; font-weight: 600; color: var(--text-muted); margin-bottom: 1.5rem; }

        /* 喇叭按钮 */
        .speaker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid #e0e0e8;
            background: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
            color: var(--text-muted);
            line-height: 1;
        }
        .speaker-btn:hover {
            border-color: var(--accent-light);
            color: var(--accent);
            background: #f8f7ff;
            transform: scale(1.08);
        }
        .speaker-btn:active { transform: scale(0.94); }
        .speaker-btn.speaking {
            border-color: var(--accent);
            color: #fff;
            background: var(--accent);
            animation: speakerPulse 0.6s ease-in-out infinite;
        }
        @keyframes speakerPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(108, 92, 231, 0); }
        }
        .speaker-btn-sm {
            width: 30px; height: 30px;
            font-size: 0.85rem;
            border-width: 1.5px;
        }
        .speaker-btn-lg {
            width: 46px; height: 46px;
            font-size: 1.3rem;
        }

        .en-definition-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 1.4rem;
        }
        .en-definition-row .en-definition {
            flex: 1;
            margin-bottom: 0;
        }
        .en-definition-row .speaker-btn {
            margin-top: 0.6rem;
        }

        .example-en-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .example-en-row .example-en {
            flex: 1;
            margin-bottom: 0.5rem;
        }
        .example-en-row .speaker-btn {
            margin-top: 0.15rem;
        }

        .article-speaker-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .section-label {
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--accent-light); margin-bottom: 0.4rem;
        }

        .en-definition {
            font-size: 1.05rem; font-weight: 700;
            color: var(--text); margin-bottom: 1.4rem;
            line-height: 1.5; padding: 0.8rem 1.2rem;
            background: #f8f7ff; border-radius: 1rem;
            border-left: 4px solid var(--accent-light);
        }

        .cn-definition-wrapper {
            position: relative;
            margin-bottom: 0.3rem;
            padding: 0.8rem 1.2rem;
            background: #fffaef; border-radius: 1rem;
            border-left: 4px solid var(--orange);
            min-height: 3rem;
            display: flex; align-items: center; justify-content: center;
        }
        .cn-definition {
            font-size: 1.05rem; font-weight: 800;
            color: var(--text);
            transition: filter 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cn-definition.blurred { filter: blur(7px); opacity: 0.12; user-select: none; }
        .doodle-cover {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            border-radius: 1rem; overflow: hidden;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        .doodle-cover.fading { opacity: 0; }
        .doodle-cover svg { width: 100%; height: 100%; position: absolute; }

        .reveal-btn {
            display: flex; width: fit-content;
            align-items: center; gap: 0.3rem;
            padding: 0.4rem 1rem;
            margin-left: auto;
            font-family: 'Nunito', sans-serif;
            font-size: 0.78rem; font-weight: 800;
            color: var(--orange); background: #fff;
            border: 2px solid #ffeaa7; border-radius: 999px;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
            margin-top: 0.3rem;
            margin-bottom: 1.2rem;
        }
        .reveal-btn:hover { background: #fff8e1; border-color: var(--orange); transform: scale(1.04); }
        .reveal-btn.showing { color: #00b894; border-color: #b2f0e2; background: #f0fdf9; }

        .example-box {
            background: #f0fdf9;
            border-radius: 1rem;
            border-left: 4px solid var(--green);
            padding: 1rem 1.2rem;
            text-align: left;
            position: relative;
        }
        .example-en {
            font-size: 1.05rem; font-weight: 700;
            color: var(--text);
            line-height: 1.9;
            margin-bottom: 0.5rem;
            cursor: default;
        }
        /* 全局可点击单词样式 */
        .word-clickable {
            cursor: pointer;
            border-radius: 0.22rem;
            padding: 0 2px;
            position: relative;
            display: inline-block;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .word-clickable:hover {
            background: rgba(108, 92, 231, 0.13);
            transform: scale(1.08) translateY(-1px);
            box-shadow: 0 2px 6px rgba(108, 92, 231, 0.1);
            z-index: 1;
        }
        .word-clickable:active {
            transform: scale(0.95);
            transition: all 0.08s ease;
        }
        .example-en .word-highlight {
            color: #e74c3c; font-weight: 900;
            background: #fff5f5; padding: 0.1rem 0.3rem;
            border-radius: 0.35rem;
            border-bottom: 2px solid rgba(231, 76, 60, 0.3);
        }

        .example-cn-wrapper {
            position: relative;
            padding: 0.5rem 0.8rem;
            background: #fffdf5; border-radius: 0.6rem;
            min-height: 2rem;
            display: flex; align-items: center;
        }
        .example-cn {
            font-size: 0.9rem; font-weight: 600;
            color: var(--text-muted);
            transition: filter 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .example-cn.blurred { filter: blur(5px); opacity: 0.12; user-select: none; }
        .doodle-cover-example {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            border-radius: 0.6rem; overflow: hidden;
            transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        .doodle-cover-example.fading { opacity: 0; }
        .doodle-cover-example svg { width: 100%; height: 100%; position: absolute; }
        .reveal-btn-example {
            display: flex; width: fit-content;
            align-items: center; gap: 0.25rem;
            padding: 0.3rem 0.8rem;
            margin-left: auto;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem; font-weight: 800;
            color: var(--green); background: #fff;
            border: 2px solid #b2f0e2; border-radius: 999px;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap;
            margin-top: 0.3rem;
        }
        .reveal-btn-example:hover { background: #f0fdf9; border-color: var(--green); transform: scale(1.04); }
        .reveal-btn-example.showing { color: #e74c3c; border-color: #ffcccc; background: #fff5f5; }

        /* 词译弹窗 */
        .word-tooltip {
            position: fixed; z-index: 9999; pointer-events: none;
            opacity: 0; transform: translateY(10px) scale(0.92);
            transition: opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .word-tooltip.visible {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
        }
        .word-tooltip-inner {
            background: #2d2d3a; color: #fff;
            padding: 0.6rem 1rem; border-radius: 0.9rem;
            font-size: 0.85rem; font-weight: 700;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            text-align: center;
            backdrop-filter: blur(10px);
            line-height: 1.5;
        }
        .word-tooltip-inner strong { color: #74b9ff; }
        .word-tooltip-inner .tooltip-original {
            font-size: 0.72rem; color: rgba(255,255,255,0.55);
            margin-bottom: 0.1rem; font-weight: 600;
        }
        .word-tooltip-arrow {
            width: 0; height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid #2d2d3a;
            margin: 0 auto;
        }

        /* 导航 */
        .nav-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
        }
        .nav-area .nav-left { display: flex; align-items: center; gap: 0.6rem; }
        .btn-prev {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.9rem 1.8rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem; font-weight: 900;
            color: var(--text-muted); background: #fff;
            border: 2px solid var(--border); border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
        }
        .btn-prev:hover { color: var(--accent); border-color: var(--accent-light); transform: translateY(-2px); }
        .btn-prev:active { transform: scale(0.97); }
        .btn-prev.hidden-nav { visibility: hidden; }

        .btn-back-article {
            display: none;
            align-items: center; gap: 0.3rem;
            padding: 0.9rem 1.4rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem; font-weight: 900;
            color: var(--orange); background: #fff;
            border: 2px solid #ffeaa7; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
        }
        .btn-back-article.visible { display: inline-flex; }
        .btn-back-article:hover { background: #fff8e1; border-color: var(--orange); transform: translateY(-2px); }

        .btn-next {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.9rem 2rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-next:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-next:active { transform: scale(0.97); }
        .btn-next .next-arrow { font-size: 1.2rem; transition: transform 0.3s ease; }
        .btn-next:hover .next-arrow { transform: translateX(4px); }
        .btn-next.finish {
            background: linear-gradient(135deg, var(--accent), #e74c3c);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35);
            animation: finishGlow 1.5s ease-in-out infinite;
        }
        @keyframes finishGlow {
            0%, 100% { box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35); }
            50% { box-shadow: 0 8px 36px rgba(231, 76, 60, 0.5); }
        }

        /* ========== 挑战页 ========== */
        .challenge-page {
            display: none;
            flex-direction: column; align-items: center;
            width: 90%; max-width: 740px;
            padding: 1.5rem 0 2rem;
        }
        .challenge-page.active { display: flex; }
        .challenge-header { text-align: center; margin-bottom: 1.5rem; }
        .challenge-header .challenge-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e74c3c, #fd79a8);
            color: #fff;
            font-size: 0.85rem; font-weight: 900;
            padding: 0.4rem 1.5rem;
            border-radius: 999px; letter-spacing: 0.08em;
            margin-bottom: 0.8rem;
        }
        .challenge-header h2 { font-size: 2rem; font-weight: 900; color: var(--text); line-height: 1.3; }
        .challenge-header p { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-top: 0.3rem; }

        .word-bank {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .word-bank .bank-title {
            font-size: 0.8rem; font-weight: 800;
            color: var(--text-muted); letter-spacing: 0.08em;
            text-transform: uppercase; margin-bottom: 0.6rem;
        }
        .word-bank .bank-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .bank-tag {
            font-size: 0.75rem; font-weight: 800;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            background: #fff5f5; color: #e74c3c;
            border: 1.5px solid #ffe0e0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .bank-tag {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bank-tag:hover {
            background: #ffe0e0;
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.15);
        }

        .article-card {
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
            line-height: 2.1;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
        }
        .article-card h3 { font-size: 1.3rem; font-weight: 900; margin-bottom: 1rem; color: var(--text); }
        .article-card p { margin-bottom: 0.8rem; }

        .article-card .word-highlight {
            color: #e74c3c; font-weight: 900;
            background: #fff5f5; padding: 0.15rem 0.35rem;
            border-radius: 0.35rem;
            border-bottom: 2px solid rgba(231, 76, 60, 0.3);
            cursor: pointer; transition: all 0.2s ease;
            position: relative;
        }
        .article-card .word-highlight {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .article-card .word-highlight:hover {
            background: #ffe0e0;
            box-shadow: 0 3px 12px rgba(231, 76, 60, 0.25);
            transform: translateY(-2px) scale(1.03);
        }
        .article-card .word-highlight::after {
            content: '📖'; font-size: 0.65rem;
            position: absolute; top: -8px; right: -4px;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .article-card .word-highlight:hover::after { opacity: 1; }

        .article-card .word-clickable { }

        .challenge-nav { width: 100%; display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
        .btn-again {
            padding: 0.9rem 2.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-again:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }

        /* ========== 完成页 ========== */
        .complete-page {
            display: none;
            flex-direction: column; align-items: center;
            gap: 2rem; text-align: center;
            width: 90%; max-width: 500px;
        }
        .complete-page.active { display: flex; }
        .complete-icon { font-size: 5rem; animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }
        .complete-page h2 { font-size: 2rem; font-weight: 900; color: var(--text); }
        .complete-page .complete-stats { font-size: 1.05rem; font-weight: 700; color: var(--text-muted); line-height: 1.8; }
        .complete-page .complete-stats strong { color: var(--accent); font-weight: 900; }
        .btn-restart {
            padding: 0.9rem 2.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer; letter-spacing: 0.04em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-restart-outline {
            background: #fff !important; color: var(--text-muted) !important;
            border: 2px solid var(--border) !important; box-shadow: none !important;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .cover-page h1 { font-size: 1.7rem; }
            .word-english { font-size: 1.9rem; }
            .word-english.phrase-text { font-size: 1.4rem; }
            .word-card { padding: 1.5rem 1.2rem; }
            .article-card { padding: 1.5rem 1.2rem; font-size: 0.9rem; }
            .btn-prev, .btn-next { padding: 0.7rem 1.4rem; font-size: 0.85rem; }
        }

        /* ========== 选择弹窗 ========== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal-card {
            background: #fff;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .modal-card h3 {
            font-size: 1.4rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.5rem;
        }
        .modal-card .modal-desc {
            font-size: 0.85rem; font-weight: 700;
            color: var(--text-muted); margin-bottom: 2rem;
        }
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .modal-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.5rem;
            border: 2px solid var(--border);
            border-radius: 1.2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #fff;
            text-align: left;
            font-family: 'Nunito', sans-serif;
        }
        .modal-option:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px) scale(1.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-option .opt-icon {
            width: 50px; height: 50px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .modal-option:nth-child(1) .opt-icon { background: #f3f0ff; }
        .modal-option:nth-child(2) .opt-icon { background: #e6fffa; }
        .modal-option .opt-info { flex: 1; }
        .modal-option .opt-title {
            font-size: 1rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.15rem;
        }
        .modal-option .opt-sub {
            font-size: 0.78rem; font-weight: 700;
            color: var(--text-muted);
        }
        .modal-close {
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem; font-weight: 800;
            color: var(--text-muted); background: none;
            border: none; cursor: pointer;
        }
        .modal-close:hover { color: var(--text); }

        /* ========== 听力页 ========== */
        .listen-page {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 700px;
            padding: 1.5rem 0 2rem;
        }
        .listen-page.active { display: flex; }

        .listen-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
        }
        .listen-source-tag {
            display: inline-block;
            font-size: 0.75rem; font-weight: 900;
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            letter-spacing: 0.06em;
        }
        .listen-source-tag.real { background: #ffe0e0; color: #c0392b; }
        .listen-source-tag.mock { background: #fff3e0; color: #e67e22; }

        .listen-card {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }
        .listen-card h3 {
            font-size: 1.2rem; font-weight: 900;
            color: var(--text); margin-bottom: 0.5rem;
        }
        .listen-card .listen-instruction {
            font-size: 0.85rem; font-weight: 700;
            color: var(--text-muted); margin-bottom: 1.2rem;
            line-height: 1.5;
        }
        .listen-questions {
            background: #fafafa;
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
        }
        .listen-questions h4 {
            font-size: 0.85rem; font-weight: 900;
            color: var(--accent); margin-bottom: 0.8rem;
            letter-spacing: 0.06em;
        }
        .listen-questions .q-item {
            font-size: 0.9rem; font-weight: 700;
            color: var(--text); margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        .listen-questions .q-item .q-num {
            display: inline-block;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 0.7rem; font-weight: 900;
            text-align: center; line-height: 24px;
            margin-right: 0.4rem;
        }

        .listen-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .btn-listen-play {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.8rem 2rem;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 900;
            color: #fff; background: var(--accent);
            border: none; border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-listen-play:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35); }
        .btn-listen-play.playing {
            background: #e74c3c;
            animation: finishGlow 1.5s ease-in-out infinite;
        }
        .btn-toggle-transcript {
            padding: 0.8rem 1.5rem;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem; font-weight: 900;
            color: var(--accent); background: #fff;
            border: 2px solid var(--accent-light);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-toggle-transcript:hover {
            background: #f8f7ff;
            transform: translateY(-2px);
        }

        .listen-transcript {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            line-height: 2;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
        }
        .listen-transcript.visible { display: block; animation: fadeIn 0.3s ease; }

        .listen-transcript .t-sentence {
            padding: 0.3rem 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
            display: inline;
        }
        .listen-transcript .t-sentence.active {
            background: #dbe9ff;
            color: #1a56db;
            font-weight: 800;
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.12);
            transform: scale(1.02);
        }
        .listen-transcript .word-clickable { }

        /* 听力进度条 */
        .listen-progress-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1rem;
            width: 100%;
        }
        .listen-time {
            font-size: 0.75rem; font-weight: 700;
            color: var(--text-muted);
            min-width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .listen-progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress-pct, 0%), #e0e0e8 var(--progress-pct, 0%), #e0e0e8 100%);
            outline: none;
            cursor: pointer;
        }
        .listen-progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 10px var(--accent-glow);
            transition: transform 0.15s ease;
        }
        .listen-progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        .listen-progress-bar::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .listen-progress-bar::-moz-range-progress {
            background: var(--accent);
            height: 6px;
            border-radius: 3px;
        }

        .listen-nav {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        /* 听力历史 */
        .history-tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            background: #eeeef2;
            border-radius: 999px;
            padding: 0.25rem;
        }
        .history-tab {
            flex: 1;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            border: none;
            font-family: 'Nunito', sans-serif;
            font-size: 0.82rem; font-weight: 800;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .history-tab.active {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

    <!-- ==================== 词译弹窗 ==================== -->
    <div class="word-tooltip" id="wordTooltip">
        <div class="word-tooltip-inner">
            <div class="tooltip-original" id="tooltipOriginal"></div>
            <div id="tooltipTranslation"></div>
        </div>
        <div class="word-tooltip-arrow"></div>
    </div>

    <!-- ==================== 封面页 ==================== -->
    <div class="cover-page" id="coverPage">
        <h1>你的英语学习之旅</h1>
        <div class="btn-wrapper">
            <div class="btn-ring"></div><div class="btn-ring"></div>
            <button class="btn-start" onclick="startNewSession()">
                <span>开始学习</span><span class="btn-arrow">→</span>
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
            <div class="history-header">
                <h3>📋 历史学习记录 <span class="history-count" id="historyCount">0</span></h3>
            </div>
            <div class="history-tabs">
                <button class="history-tab active" id="tabVocab" onclick="switchHistoryTab('vocab')">📖 词汇学习</button>
                <button class="history-tab" id="tabListen" onclick="switchHistoryTab('listen')">🎧 听力练习</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">
                    <div class="empty-icon">📭</div>
                    <div>还没有学习记录<br>点击上方按钮开始你的第一次学习吧！</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 听力练习页 ==================== -->
    <div class="listen-page" id="listenPage">
        <div class="listen-header">
            <span class="listen-source-tag" id="listenSourceTag"></span>
            <span style="font-size:0.8rem;font-weight:800;color:var(--text-muted);" id="listenPassageId"></span>
            <button class="exit-btn" onclick="goToCover()">✕ 退出</button>
        </div>
        <div class="listen-card">
            <h3 id="listenTitle"></h3>
            <div class="listen-instruction" id="listenInstruction"></div>
            <div class="listen-questions" id="listenQuestions"></div>
            <div class="listen-controls">
                <button class="btn-listen-play" id="btnListenPlay" onclick="toggleListenPlay()">
                    🔊 <span id="btnListenLabel">播放听力</span>
                </button>
                <button class="btn-toggle-transcript" id="btnToggleTranscript" onclick="toggleTranscript()">
                    📄 显示原文
                </button>
            </div>
            <div class="listen-progress-wrapper" id="listenProgressWrapper" style="display:none;">
                <span class="listen-time" id="listenTimeCurrent">0:00</span>
                <input type="range" class="listen-progress-bar" id="listenProgressBar" min="0" max="1000" value="0" oninput="updateProgressVisual(this.value)" onchange="seekListenProgress(this.value)" />
                <span class="listen-time" id="listenTimeTotal">0:00</span>
            </div>
        </div>
        <div class="listen-transcript" id="listenTranscript"></div>
        <div class="listen-nav">
            <button class="btn-again" onclick="goToCover()">🔄 返回主页</button>
        </div>
    </div>

    <!-- ==================== 学习页 ==================== -->
    <div class="learn-page" id="learnPage">
        <div class="top-bar">
            <span class="word-counter" id="wordCounterLabel">词汇 <strong id="currentNum">1</strong> / 30</span>
            <div class="mini-progress-wrapper">
                <div class="mini-progress" id="miniProgressBar" onclick="toggleNumberGrid(event)">
                    <div class="mini-progress-fill" id="miniProgressFill" style="width:3.33%"></div>
                </div>
                <div class="number-grid-popup" id="numberGrid"></div>
            </div>
            <button class="exit-btn" onclick="goToCover()">✕ 退出</button>
        </div>
        <div class="word-card">
            <div class="type-tag" id="typeTag"></div>
            <div class="word-english-row">
                <div class="word-english" id="wordEnglish"></div>
                <button class="speaker-btn speaker-btn-lg" id="speakerWord" onclick="speakWord()" title="朗读单词">🔊</button>
            </div>
            <div class="word-phonetic" id="wordPhonetic"></div>
            <div class="section-label">📖 English Definition</div>
            <div class="en-definition-row">
                <div class="en-definition" id="enDefinition"></div>
                <button class="speaker-btn speaker-btn-sm" id="speakerDef" onclick="speakDefinition()" title="朗读释义">🔊</button>
            </div>
            <div class="section-label">🇨🇳 中文释义</div>
            <div class="cn-definition-wrapper" id="cnWrapper">
                <span class="cn-definition blurred" id="cnDefinition"></span>
                <div class="doodle-cover" id="doodleCover"></div>
            </div>
            <button class="reveal-btn" id="revealBtn" onclick="toggleChinese()">👀 显示</button>
            <div class="example-section">
                <div class="section-label">💬 Example Sentence</div>
                <div class="example-box">
                    <div class="example-en-row">
                        <div class="example-en" id="exampleEn"></div>
                        <button class="speaker-btn speaker-btn-sm" id="speakerExample" onclick="speakExample()" title="朗读例句">🔊</button>
                    </div>

            return used;
        }

                if (!used.has(i)) available.push(i);
            });

            // 如果可用词汇不足，则重置历史（所有词都可以用）
            if (available.length < count) {
                if (confirm('所有词汇都已学过！是否清除历史记录以重新开始？')) {
                    localStorage.removeItem('ielts_history');
                    return pickNewWords(count);
                }
                // 用户拒绝清除，就用所有可用的
            }

            // 随机打乱可用索引
            const shuffled = [...available].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, available.length));
        }

        function startListenPlay() {
            if (!currentPassage) return;
            stopSpeaking();
            listenIsPlaying = true;

            const btn = document.getElementById('btnListenPlay');
            btn.classList.add('playing');
            document.getElementById('btnListenLabel').textContent = '停止播放';

            // 显示进度条
            const progressWrapper = document.getElementById('listenProgressWrapper');

        function speakFromSentence(startIdx) {
            // 清除之前的定时器和语音（先解绑回调，防止 cancel 触发 stopListenPlay）
            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
            }
            speechSynthesis.cancel();
            listenTimers.forEach(t => clearTimeout(t));
            listenTimers = [];
            if (listenProgressInterval) clearInterval(listenProgressInterval);

            listenSentenceIndex = startIdx;
            const sentences = currentPassage.sentences;
            const remainingSentences = sentences.slice(startIdx);

            // 计算全文字数和时间
            const allWordCounts = sentences.map(s => s.split(' ').length);
            const totalWords = allWordCounts.reduce((a, b) => a + b, 0);
            const wordsPerSec = 2.2;
            listenTotalDuration = (totalWords / wordsPerSec) * 1000;

            // 计算每句的起始时间（ms）
            listenSentenceStartTimes = [];
            let elapsed = 0;
            for (let i = 0; i < sentences.length; i++) {
                listenSentenceStartTimes.push(elapsed);
                elapsed += (allWordCounts[i] / totalWords) * listenTotalDuration;
            }

            // 设置进度条最大值
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar) {
                progressBar.max = 1000;
                progressBar.value = Math.round((listenSentenceStartTimes[startIdx] / listenTotalDuration) * 1000);
            }
            document.getElementById('listenTimeTotal').textContent = formatTime(listenTotalDuration / 1000);

            // 从 startIdx 开始播放
            const remainingText = remainingSentences.join(' ');
            const utterance = new SpeechSynthesisUtterance(remainingText);
            utterance.lang = 'en-US';
            utterance.rate = 0.88;
            const voices = speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            listenStartTime = Date.now() - listenSentenceStartTimes[startIdx];

            // 为剩余句子设置高亮定时器
            const remainingWordCounts = allWordCounts.slice(startIdx);
            const remainingTotalWords = remainingWordCounts.reduce((a, b) => a + b, 0);
            const remainingDuration = (remainingTotalWords / wordsPerSec) * 1000;
            let timerElapsed = 0;

            for (let i = 0; i < remainingSentences.length; i++) {
                const sentenceIdx = startIdx + i;
                const delay = timerElapsed;
                const timerId = setTimeout(() => {
                    if (!listenIsPlaying) return;
                    listenSentenceIndex = sentenceIdx;
                    highlightTranscriptSentence(sentenceIdx);
                }, delay);
                listenTimers.push(timerId);
                timerElapsed += (remainingWordCounts[i] / remainingTotalWords) * remainingDuration;
            }

            utterance.onend = () => {
                stopListenPlay();
                listenTimers.forEach(t => clearTimeout(t));
                // 播放完成，进度条跳到100%
                if (progressBar) progressBar.value = 1000;
                document.getElementById('listenTimeCurrent').textContent = formatTime(listenTotalDuration / 1000);
            };
            utterance.onerror = () => {
                stopListenPlay();
                listenTimers.forEach(t => clearTimeout(t));
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);

            // 启动进度条更新
            listenProgressInterval = setInterval(updateListenProgress, 100);
        }

        function updateListenProgress() {
            if (!listenIsPlaying) return;
            const elapsed = Date.now() - listenStartTime;
            const pct = Math.min(elapsed / listenTotalDuration, 1);
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar && document.activeElement !== progressBar) {
                progressBar.value = Math.round(pct * 1000);
                progressBar.style.setProperty('--progress-pct', (pct * 100) + '%');
            }
            document.getElementById('listenTimeCurrent').textContent = formatTime(Math.min(elapsed / 1000, listenTotalDuration / 1000));
        }

        function updateProgressVisual(value) {
            const pct = parseInt(value) / 10; // 0-100
            const progressBar = document.getElementById('listenProgressBar');
            if (progressBar) {
                progressBar.style.setProperty('--progress-pct', pct + '%');
            }
            if (listenTotalDuration > 0) {
                const ms = (parseInt(value) / 1000) * listenTotalDuration;
                document.getElementById('listenTimeCurrent').textContent = formatTime(ms / 1000);
            }
        }

        function seekListenProgress(value) {
            if (!currentPassage || !listenIsPlaying) return;
            const pct = parseInt(value) / 1000;
            const targetMs = pct * listenTotalDuration;

            // 找到对应句子
            let targetIdx = 0;
            for (let i = listenSentenceStartTimes.length - 1; i >= 0; i--) {
                if (listenSentenceStartTimes[i] <= targetMs) {
                    targetIdx = i;
                    break;
                }
            }

            speakFromSentence(targetIdx);
            highlightTranscriptSentence(targetIdx);
        }

        function seekToSentence(idx) {
            if (!currentPassage) return;
            speakFromSentence(idx);
            highlightTranscriptSentence(idx);
        }

        function stopListenPlay() {
            if (!listenIsPlaying) return;
            listenIsPlaying = false;
            speechSynthesis.cancel();
            currentUtterance = null;
            listenTimers.forEach(t => clearTimeout(t));
            listenTimers = [];
            if (listenProgressInterval) { clearInterval(listenProgressInterval); listenProgressInterval = null; }
            const btn = document.getElementById('btnListenPlay');
            if (btn) {
                btn.classList.remove('playing');
                document.getElementById('btnListenLabel').textContent = '播放听力';
            }
            document.querySelectorAll('.t-sentence.active').forEach(el => el.classList.remove('active'));
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function buildTranscriptDOM() {
            if (!currentPassage) return;
            const container = document.getElementById('listenTranscript');

        function highlightTranscriptSentence(idx) {
            if (!transcriptVisible) return;
            document.querySelectorAll('.t-sentence.active').forEach(el => el.classList.remove('active'));

        function toggleTranscript() {
            const container = document.getElementById('listenTranscript');

            if (transcriptVisible) {
                if (!container.innerHTML.trim()) buildTranscriptDOM();

            }
        }

        // ========== 文本高亮与可点击词 ==========
        function renderTextWithHighlights(text, highlightTerms, clickable = true) {
            const textLower = text.toLowerCase();
            const highlights = [];
            for (const term of highlightTerms) {
                const termLower = term.toLowerCase();
                let idx = 0;
                while ((idx = textLower.indexOf(termLower, idx)) !== -1) {
                    highlights.push({ start: idx, end: idx + term.length, term: term });
                    idx += term.length;
                }
            }
            highlights.sort((a, b) => a.start - b.start || b.end - a.end);
            const merged = [];
            for (const h of highlights) {
                if (merged.length === 0 || h.start >= merged[merged.length - 1].end) merged.push(h);
            }
            let result = '';
            let pos = 0;
            for (const h of merged) {
                if (pos < h.start) result += wrapPlainWords(text.slice(pos, h.start));
                const onclick = clickable ? ` onclick="event.stopPropagation();onHighlightClick('${escapeHtml(h.term)}')"` : '';
                result += `<span class="word-highlight" data-term="${escapeHtml(h.term)}"${onclick}>${escapeHtml(text.slice(h.start, h.end))}</span>`;
                pos = h.end;
            }
            if (pos < text.length) result += wrapPlainWords(text.slice(pos));
            return result;
        }

        function wrapPlainWords(text) {
            return text.replace(/([a-zA-Z]+(?:'[a-zA-Z]+)?)/g, (match) => {
                return `<span class="word-clickable" data-word="${escapeHtml(match)}" onclick="event.stopPropagation();onWordClick(event, '${escapeHtml(match)}')">${escapeHtml(match)}</span>`;
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ========== 词译弹窗 ==========
        function lookupWord(w) {
            // 1. 精确匹配
            if (dictionary[w]) return dictionary[w];
            // 2. 去掉结尾标点
            const clean = w.replace(/[^a-z']/g, '');
            if (dictionary[clean]) return dictionary[clean];
            // 3. 尝试词干形式
            const tries = [];
            if (clean.endsWith('s') && !clean.endsWith('ss')) tries.push(clean.slice(0, -1));
            if (clean.endsWith('es')) tries.push(clean.slice(0, -2));
            if (clean.endsWith('ies')) tries.push(clean.slice(0, -3) + 'y');
            if (clean.endsWith('ves')) tries.push(clean.slice(0, -3) + 'f');
            if (clean.endsWith('ing')) { tries.push(clean.slice(0, -3)); tries.push(clean.slice(0, -3) + 'e'); }
            if (clean.endsWith('ed')) { tries.push(clean.slice(0, -2)); tries.push(clean.slice(0, -1)); tries.push(clean.slice(0, -2) + 'e'); }
            if (clean.endsWith('er')) { tries.push(clean.slice(0, -2)); tries.push(clean.slice(0, -2) + 'e'); }
            if (clean.endsWith('est')) { tries.push(clean.slice(0, -3)); tries.push(clean.slice(0, -3) + 'e'); }
            if (clean.endsWith('ly')) tries.push(clean.slice(0, -2));
            if (clean.endsWith('ness')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ment')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('tion')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('sion')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('able')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ible')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ful')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('less')) tries.push(clean.slice(0, -4));
            if (clean.endsWith('ous')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('ive')) tries.push(clean.slice(0, -3));
            if (clean.endsWith('al')) tries.push(clean.slice(0, -2));
            if (clean.endsWith('ally')) tries.push(clean.slice(0, -4));
            for (const t of tries) { if (dictionary[t]) return dictionary[t]; }
            return null;
        }

        // ========== 翻译缓存 ==========
        function getTranslationCache() {
            try { return JSON.parse(localStorage.getItem('word_cache') || '{}'); }
            catch (e) { return {}; }
        }
        function saveTranslationCache(cache) {
            try { localStorage.setItem('word_cache', JSON.stringify(cache)); }
            catch (e) { /* storage full, ignore */ }
        }

        async function translateWordENtoZH(word) {
            const clean = word.toLowerCase().replace(/[^a-z]/g, '');
            if (!clean || clean.length < 2) return null;

            // 1. 本地词典 + 词形还原
            const local = lookupWord(clean);
            if (local) return local;

            // 2. 缓存
            const cache = getTranslationCache();
            if (cache[clean]) return cache[clean];

            // 3. MyMemory API
            try {
                const resp = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|zh`);
                const data = await resp.json();
                if (data.responseStatus === 200 && data.responseData.translatedText) {
                    const translated = data.responseData.translatedText;
                    // 去重：如果翻译结果和原文一样，标记为未知
                    if (translated.toLowerCase() === clean.toLowerCase()) return null;
                    cache[clean] = translated;
                    saveTranslationCache(cache);
                    return translated;
                }
            } catch (e) { /* API失败 */ }
            return null;
        }

        function formatTranslation(translation) {
            if (!translation) return '—';
            // 用 | 分隔多个释义
            const parts = translation.split('|');
            if (parts.length === 1) return parts[0];
            return parts.map((p, i) => i === 0 ? `<strong>${p}</strong>` : p).join(' · ');
        }

        function onWordClick(event, word) {
            event.stopPropagation();

            // 听力播放中点击原文单词 → 跳转到该单词所在句子
            if (listenIsPlaying && event.target.closest('#listenTranscript')) {
                const sentenceEl = event.target.closest('.t-sentence');
                if (sentenceEl) {
                    const idx = parseInt(sentenceEl.getAttribute('data-sidx'));
                    if (!isNaN(idx)) {
                        seekToSentence(idx);
                        return;
                    }
                }
            }

            const wordLower = word.toLowerCase().replace(/[^a-z']/g, '');
            const tooltip = document.getElementById('wordTooltip');
            const tooltipOrig = document.getElementById('tooltipOriginal');
            const tooltipTrans = document.getElementById('tooltipTranslation');

            if (tooltipWord === wordLower && tooltip.classList.contains('visible')) {
                hideTooltip();
                return;
            }
            tooltipWord = wordLower;
            tooltipOrig.textContent = word;
            tooltipTrans.innerHTML = '查询中…';

            const target = event.target;
            const rect = target.getBoundingClientRect();
            // 动态计算宽度
            tooltip.style.whiteSpace = 'normal';
            tooltip.style.maxWidth = '280px';
            const tooltipWidth = Math.min(tooltip.offsetWidth || 180, 280);
            const left = Math.min(Math.max(rect.left + rect.width / 2 - tooltipWidth / 2, 10), window.innerWidth - tooltipWidth - 10);
            const top = rect.top - 60;
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.classList.add('visible');

            translateWordENtoZH(wordLower).then(translation => {
                if (tooltipWord === wordLower) {
                    tooltipTrans.innerHTML = formatTranslation(translation);
                }
            });
        }

        function hideTooltip() {
            document.getElementById('wordTooltip').classList.remove('visible');
            tooltipWord = null;
        }

            if (!e.target.closest('.word-clickable')) hideTooltip();

        // ========== 最终挑战文章（动态生成） ==========
        function renderArticle() {
            const allTerms = currentVocabulary.map(v => v.en);
            document.getElementById('bankTags').innerHTML = allTerms.map(t =>
                `<span class="bank-tag" onclick="onBankTagClick('${escapeHtml(t)}')">${escapeHtml(t)}</span>`
            ).join('');

            const pool = [...currentVocabulary];
            const take = () => pool.length > 0 ? pool.splice(Math.floor(Math.random() * pool.length), 1)[0] : null;
            const use = (w) => {
                if (!w) return null;
                return `<span class="word-highlight" data-term="${escapeHtml(w.en)}" onclick="event.stopPropagation();onHighlightClick('${escapeHtml(w.en)}')">${escapeHtml(w.en)}</span>`;
            };

            const paras = [];

            function fillTemplate(tpl) {
                let html = tpl.replace(/\[W\]/g, () => {
                    const w = take();
                    return w ? use(w) : '';
                });
                // 清理词汇耗尽后的多余空格
                html = html.replace(/\s{2,}/g, ' ').replace(/\s([.,;:!?])/g, '$1').trim();
                return html;
            }

            paras.push(fillTemplate(`In today's world, we must [W] for better policies and [W] resources wisely to [W] the negative trends. Experts [W] that constant criticism can [W] confidence, so a new [W] is needed.`));
            paras.push(fillTemplate(`There is a growing [W] that climate action is urgent. The government must [W] funds to address this crisis. Critics argue current measures are [W] and we must not [W] the severity of the situation. Taking action is now [W].`));
            paras.push(fillTemplate(`Education is an [W] part of social progress. Schools should [W] creativity rather than [W] it with rigid rules. Many children are [W] to online dangers, making digital literacy [W]. Teachers must [W] on how to protect students.`));
            paras.push(fillTemplate(`Economic growth often [W] environmental damage. We must find ways to [W] the negative effects. A [W] plan is needed, one that does not [W] natural resources. Some companies have begun to [W] such measures with [W] results.`));
            paras.push(fillTemplate(`Public opinion has begun to [W] on this issue, and the evidence [W] immediate reform. Many still [W] outdated beliefs, making progress difficult. We must [W] the barriers and find [W] solutions to move forward.`));
            paras.push(fillTemplate(`Technology is now [W] in modern life, with [W] changes happening daily. The [W] volume of data can feel [W]. Experts [W] for better regulation to [W] users from harm while encouraging innovation.`));
            paras.push(fillTemplate(`The crisis was an [W] event that [W] major disruption worldwide. It created a new [W] for public health. Many systems were [W] to handle the surge. We must learn from this to [W] our defences for the future.`));
            paras.push(fillTemplate(`Scholars [W] that without change, society will [W] further. The [W] between rich and poor continues to grow. History shows us that [W] moments can [W] lasting transformation when people come together.`));

            // Remaining words
            if (pool.length > 0) {
                const remaining = pool.map(w => use(w)).filter(Boolean).join(', ');
                if (remaining) {
                    paras.push(`Additional important concepts include: ${remaining}. These also shape our understanding of the issues discussed above.`);
                }
            }

            const articleHTML = `<h3>🌍 Global Challenges and Opportunities</h3>`
                + paras.map(p => {
                    // Wrap plain words in each paragraph with click handlers
                    let result = '';
                    let lastIdx = 0;
                    const regex = /<span class="word-highlight"[^>]*>.*?<\/span>/g;
                    let match;
                    while ((match = regex.exec(p)) !== null) {
                        if (match.index > lastIdx) result += wrapPlainWords(p.slice(lastIdx, match.index));
                        result += match[0];
                        lastIdx = match.index + match[0].length;
                    }
                    if (lastIdx < p.length) result += wrapPlainWords(p.slice(lastIdx));
                    return `<p>${result}</p>`;
                }).join('');

            document.getElementById('articleCard').innerHTML = articleHTML;
        }

        // ========== 语音朗读 ==========
        let currentUtterance = null;
        let currentSpeakerBtn = null;

        function stopSpeaking() {
            if (currentUtterance || listenIsPlaying) {
                speechSynthesis.cancel();
            }
            cleanupSpeech();
            if (listenIsPlaying) stopListenPlay();
        }

        function speak(text, btnId) {
            // 如果正在朗读同一内容，则停止
            if (currentUtterance && currentSpeakerBtn && currentSpeakerBtn.id === btnId) {
                stopSpeaking();
                return;
            }

            // 停止之前的朗读
            stopSpeaking();

            // 清理文本中的 HTML 标签
            const cleanText = text.replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, '');

            if (!cleanText.trim()) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;

            const voices = speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google'))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            const btn = document.getElementById(btnId);
            if (btn) {
                currentSpeakerBtn = btn;
                btn.classList.add('speaking');
            }

            // 仅文章朗读时显示提示
            if (btnId === 'speakerArticle') {
                const hint = document.getElementById('articleSpeakingHint');
                if (hint) hint.style.display = 'inline';
            }

            utterance.onend = () => {
                cleanupSpeech();
            };

            utterance.onerror = () => {
                cleanupSpeech();
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);
        }

        function cleanupSpeech() {
            if (currentSpeakerBtn) {
                currentSpeakerBtn.classList.remove('speaking');
                currentSpeakerBtn = null;
            }
            currentUtterance = null;
            const hint = document.getElementById('articleSpeakingHint');
            if (hint) hint.style.display = 'none';
        }

        function speakWord() {
            const word = document.getElementById('wordEnglish').textContent;
            speak(word, 'speakerWord');
        }

        function speakDefinition() {
            const def = document.getElementById('enDefinition').textContent || document.getElementById('enDefinition').innerText;
            speak(def, 'speakerDef');
        }

        function speakExample() {
            const example = document.getElementById('exampleEn').textContent;
            speak(example, 'speakerExample');
        }

        function speakArticle() {
            const article = document.getElementById('articleCard');
            if (!article) return;
            const text = article.textContent;
            document.getElementById('articleSpeakingHint').style.display = 'inline';
            speak(text, 'speakerArticle');
        }

        // 预加载语音列表
        if ('speechSynthesis' in window) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
        }

        // ========== 键盘导航 ==========
        document.addEventListener('keydown', (e) => {
            const learnVisible = document.getElementById('learnPage').style.display === 'flex';
            if (!learnVisible) return;
            if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
            else if (e.key === ' ') { e.preventDefault(); toggleChinese(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); toggleExampleCn(); }
        });

        // ========== 初始化 ==========
        renderHistory();
    </script>
</body>
</html>
